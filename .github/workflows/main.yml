name: Main CI Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration:
        description: Execute tutorial scripts against the live DES service
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-26.04
    timeout-minutes: 85
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python version
        run: python3 -c 'import sys; assert sys.version_info >= (3, 12)'
      - name: Check documentation and Python syntax
        run: ./start_tests.sh
      - name: Install integration dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.integration
        run: |
          python3 -m venv /tmp/des-test-env
          /tmp/des-test-env/bin/python -m pip install -r requirements.txt
      - name: Execute DES integration tests
        if: github.event_name == 'workflow_dispatch' && inputs.integration
        env:
          DES_RUN_INTEGRATION: "1"
        run: /tmp/des-test-env/bin/python -m unittest discover -s tests -v
