[project]
name = "openeo-training"
version = "0.1.0"
description = "Digital Earth Sweden Python examples and guides"
requires-python = ">=3.12"
dependencies = [
  "openeo>=0.50",
  "numpy",
  "matplotlib",
  "xarray",
  "rasterio",
  "rioxarray",
  "netCDF4",
  "h5netcdf",
  "h5py",
  "scipy",
  "dask",
  "bottleneck",
  "geopandas",
  "shapely",
  "pyproj",
  "cartopy",
  "folium",
  "PyYAML",
  "scikit-learn",
  "seaborn",
  "requests",
  "pydantic",
  "icecream",
]
