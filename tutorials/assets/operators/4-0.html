}, {"arguments": {"x": 0, "y": 0}, "returns": false}, {"arguments": {"x": 1, "y": 2}, "returns": true}, {"arguments": {"x": -0.5, "y": -0.6}, "returns": false}, {"arguments": {"x": "00:00:00+01:00", "y": "00:00:00Z"}, "returns": true}, {"arguments": {"x": "1950-01-01T00:00:00Z", "y": "2018-01-01T12:00:00Z"}, "returns": true}, {"arguments": {"x": "2018-01-01T12:00:00+00:00", "y": "2018-01-01T12:00:00Z"}, "returns": false}, {"arguments": {"x": 0, "y": true}, "returns": false}, {"arguments": {"x": false, "y": true}, "returns": false}]}, {"id": "lte", "summary": "Less than or equal to comparison", "description": "Compares whether `x` is less than or equal to `y`.\n\n**Remarks:**\n\n* If any operand is `null`, the return value is `null`. Therefore, `lte(null, null)` returns `null` instead of `true`.\n* If any operand is an array or object, the return value is `false`.\n* If the operands are not equal (see process ``eq()``) and any of them is not a `number` or temporal string (`date`, `time` or `date-time`), the process returns `false`.\n* Temporal strings can *not* be compared based on their string representation due to the time zone / time-offset representations.", "categories": ["comparison"], "parameters": [{"name": "x", "description": "First operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "y", "description": "Second operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}], "returns": {"description": "`true` if `x` is less than or equal to `y`, `null` if any operand is `null`, otherwise `false`.", "schema": {"type": ["boolean", "null"]}}, "examples": [{"arguments": {"x": 1, "y": null}}, {"arguments": {"x": 0, "y": 0}, "returns": true}, {"arguments": {"x": 1, "y": 2}, "returns": true}, {"arguments": {"x": -0.5, "y": -0.6}, "returns": false}, {"arguments": {"x": "00:00:00+01:00", "y": "00:00:00Z"}, "returns": true}, {"arguments": {"x": "1950-01-01T00:00:00Z", "y": "2018-01-01T12:00:00Z"}, "returns": true}, {"arguments": {"x": "2018-01-01T12:00:00+00:00", "y": "2018-01-01T12:00:00Z"}, "returns": true}, {"arguments": {"x": false, "y": true}, "returns": false}, {"arguments": {"x": [1, 2, 3], "y": [1, 2, 3]}, "returns": false}], "process_graph": {"eq": {"process_id": "eq", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "y"}}}, "lt": {"process_id": "lt", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "y"}}}, "or": {"process_id": "or", "result": true, "arguments": {"x": {"from_node": "lt"}, "y": {"from_node": "eq"}}}}}, {"id": "mask_polygon", "summary": "Apply a polygon mask", "description": "Applies a (multi) polygon mask to a raster data cube. To apply a raster mask use ``mask()``.\n\nAll pixels for which the point at the pixel center **does not** intersect with any polygon (as defined in the Simple Features standard by the OGC) are replaced. This behavior can be inverted by setting the parameter `inside` to `true`.\n\nThe pixel values are replaced with the value specified for `replacement`, which defaults to `null` (no data). No data values in `data` will be left untouched by the masking operation.", "categories": ["cubes", "masks"], "parameters": [{"name": "data", "description": "A raster data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "mask", "description": "A GeoJSON object containing at least one polygon. The provided feature types can be one of the following:\n\n* A `Polygon` or `MultiPolygon` geometry,\n* a `Feature` with a `Polygon` or `MultiPolygon` geometry,\n* a `FeatureCollection` containing at least one `Feature` with `Polygon` or `MultiPolygon` geometries, or\n* a `GeometryCollection` containing `Polygon` or `MultiPolygon` geometries. To maximize interoperability, `GeometryCollection` should be avoided in favour of one of the alternatives above.", "schema": {"type": "object", "subtype": "geojson", "minItems": 0.0, "deprecated": false}}, {"name": "replacement", "description": "The value used to replace masked values with.", "optional": true, "schema": [{"type": "number", "minItems": 0.0, "deprecated": false}, {"type": "boolean", "minItems": 0.0, "deprecated": false}, {"type": "string", "minItems": 0.0, "deprecated": false}, {"type": "null", "minItems": 0.0, "deprecated": false}]}, {"name": "inside", "description": "If set to `true` all pixels for which the point at the pixel center **does** intersect with any polygon are replaced.", "optional": true, "default": false, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "A masked raster data cube with the same dimensions. The dimension properties (name, type, labels, reference system and resolution) remain unchanged.", "schema": {"type": "object"}}, "links": [{"rel": "about", "href": "http://www.opengeospatial.org/standards/sfa", "title": "Simple Features standard by the OGC"}]}, {"id": "mask", "summary": "Apply a raster mask", "description": "Applies a mask to a raster data cube. To apply a vector mask use ``mask_polygon()``.\n\nA mask is a raster data cube for which corresponding pixels among `data` and `mask` are compared and those pixels in `data` are replaced whose pixels in `mask` are non-zero (for numbers) or `true` (for boolean values). The pixel values are replaced with the value specified for `replacement`, which defaults to `null` (no data).\n\nThe data cubes have to be compatible so that each dimension in the mask must also be available in the raster data cube with the same name, type, reference system, resolution and labels. Dimensions can be missing in the mask with the result that the mask is applied for each label of the missing dimension in the data cube. The process fails if there's an incompatibility found between the raster data cube and the mask.", "categories": ["cubes", "masks"], "parameters": [{"name": "data", "description": "A raster data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "mask", "description": "A mask as a raster data cube. Every pixel in `data` must have a corresponding element in `mask`.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "replacement", "description": "The value used to replace masked values with.", "optional": true, "schema": {"type": ["number", "boolean", "string", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "A masked raster data cube with the same dimensions. The dimension properties (name, type, labels, reference system and resolution) remain unchanged.", "schema": {"type": "object"}}}, {"id": "mean", "summary": "Arithmetic mean (average)", "description": "The arithmetic mean of an array of numbers is the quantity commonly called the average. It is defined as the sum of all elements divided by the number of elements.\n\nAn array without non-`null` elements resolves always with `null`.", "categories": ["math > statistics", "reducer"], "parameters": [{"name": "data", "description": "An array of numbers.", "schema": {"type": "array", "minItems": 0.0, "items": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}, "deprecated": false}}, {"name": "ignore_nodata", "description": "Indicates whether no-data values are ignored or not. Ignores them by default. Setting this flag to `false` considers no-data values so that `null` is returned if any value is such a value.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed arithmetic mean.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"data": [1, 0, 3, 2]}, "returns": 1.5}, {"arguments": {"data": [9, 2.5, null, -2.5]}, "returns": 3}, {"arguments": {"data": [1, null], "ignore_nodata": false}}, {"description": "The input array is empty: return `null`.", "arguments": {"data": []}}, {"description": "The input array has only `null` elements: return `null`.", "arguments": {"data": [null, null]}}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/ArithmeticMean.html", "title": "Arithmetic mean explained by Wolfram MathWorld"}], "process_graph": {"count_condition": {"process_id": "if", "result": false, "arguments": {"value": {"from_parameter": "ignore_nodata"}, "accept": null, "reject": true}}, "count": {"process_id": "count", "result": false, "arguments": {"data": {"from_parameter": "data"}, "condition": {"from_node": "count_condition"}}}, "sum": {"process_id": "sum", "result": false, "arguments": {"data": {"from_parameter": "data"}, "ignore_nodata": {"from_parameter": "ignore_nodata"}}}, "divide": {"process_id": "divide", "result": false, "arguments": {"x": {"from_node": "sum"}, "y": {"from_node": "count"}}}, "neq": {"process_id": "neq", "result": false, "arguments": {"x": {"from_node": "count"}, "y": 0}}, "if": {"process_id": "if", "result": true, "arguments": {"value": {"from_node": "neq"}, "accept": {"from_node": "divide"}}}}}, {"id": "median", "summary": "Statistical median", "description": "The statistical median of an array of numbers is the value separating the higher half from the lower half of the data.\n\nAn array without non-`null` elements resolves always with `null`.\n\n**Remarks:**\n\n* For symmetric arrays, the result is equal to the ``mean()``.\n* The median can also be calculated by computing the ``quantiles()`` with a probability of *0.5*.", "categories": ["math > statistics", "reducer"], "parameters": [{"name": "data", "description": "An array of numbers.", "schema": {"type": "array", "minItems": 0.0, "items": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}, "deprecated": false}}, {"name": "ignore_nodata", "description": "Indicates whether no-data values are ignored or not. Ignores them by default. Setting this flag to `false` considers no-data values so that `null` is returned if any value is such a value.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed statistical median.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"data": [1, 3, 3, 6, 7, 8, 9]}, "returns": 6}, {"arguments": {"data": [1, 2, 3, 4, 5, 6, 8, 9]}, "returns": 4.5}, {"arguments": {"data": [-1, -0.5, null, 1]}, "returns": -0.5}, {"arguments": {"data": [-1, 0, null, 1], "ignore_nodata": false}}, {"description": "The input array is empty: return `null`.", "arguments": {"data": []}}, {"description": "The input array has only `null` elements: return `null`.", "arguments": {"data": [null, null]}}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/StatisticalMedian.html", "title": "Statistical Median explained by Wolfram MathWorld"}], "process_graph": {"quantiles": {"process_id": "quantiles", "result": false, "arguments": {"data": {"from_parameter": "data"}, "probabilities": [0.5], "ignore_nodata": {"from_parameter": "ignore_nodata"}}}, "array_element": {"process_id": "array_element", "result": true, "arguments": {"data": {"from_node": "quantiles"}, "return_nodata": true, "index": 0}}}}, {"id": "merge_cubes", "summary": "Merge two data cubes", "description": "The data cubes have to be compatible. A merge operation without overlap should be reversible with (a set of) filter operations for each of the two cubes. The process performs the join on overlapping dimensions, with the same name and type.\n\nAn overlapping dimension has the same name, type, reference system and resolution in both dimensions, but can have different labels. One of the dimensions can have different labels, for all other dimensions the labels must be equal. If data overlaps, the parameter `overlap_resolver` must be specified to resolve the overlap.\n\n**Examples for merging two data cubes:**\n\n1. Data cubes with the dimensions (`x`, `y`, `t`, `bands`) have the same dimension labels in `x`, `y` and `t`, but the labels for the dimension `bands` are `B1` and `B2` for the first cube and `B3` and `B4`. An overlap resolver is *not needed*. The merged data cube has the dimensions `x`, `y`, `t` and `bands` and the dimension `bands` has four dimension labels: `B1`, `B2`, `B3`, `B4`.\n2. Data cubes with the dimensions (`x`, `y`, `t`, `bands`) have the same dimension labels in `x`, `y` and `t`, but the labels for the dimension `bands` are `B1` and `B2` for the first data cube and `B2` and `B3` for the second. An overlap resolver is *required* to resolve overlap in band `B2`. The merged data cube has the dimensions `x`, `y`, `t` and `bands` and the dimension `bands` has three dimension labels: `B1`, `B2`, `B3`.\n3. Data cubes with the dimensions (`x`, `y`, `t`) have the same dimension labels in `x`, `y` and `t`. There are two options:\n   1. Keep the overlapping values separately in the merged data cube: An overlap resolver is *not needed*, but for each data cube you need to add a new dimension using ``add_dimension()``. The new dimensions must be equal, except that the labels for the new dimensions must differ by name. The merged data cube has the same dimensions and labels as the original data cubes, plus the dimension added with ``add_dimension()``, which has the two dimension labels after the merge.\n   2. Combine the overlapping values into a single value: An overlap resolver is *required* to resolve the overlap for all pixels. The merged data cube has the same dimensions and labels as the original data cubes, but all pixel values have been processed by the overlap resolver.\n4. A data cube with dimensions (`x`, `y`, `t` / `bands`) or (`x`, `y`, `t`, `bands`) and another data cube with dimensions (`x`, `y`) have the same dimension labels in `x` and `y`. Merging them will join dimensions `x` and `y`, so the lower dimension cube is merged with each time step and band available in the higher dimensional cube. This can for instance be used to apply a digital elevation model to a spatio-temporal data cube. An overlap resolver is *required* to resolve the overlap for all pixels.\n\nAfter the merge, the dimensions with a natural/inherent label order (with a reference system this is each spatial and temporal dimensions) still have all dimension labels sorted. For other dimensions where there is no inherent order, including bands, the dimension labels keep the order in which they are present in the original data cubes and the dimension labels of `cube2` are appended to the dimension labels of `cube1`.", "categories": ["cubes"], "parameters": [{"name": "cube1", "description": "The first data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "cube2", "description": "The second data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "overlap_resolver", "description": "A reduction operator that resolves the conflict if the data overlaps. The reducer must return a value of the same data type as the input values are. The reduction operator may be a single process such as ``multiply()`` or consist of multiple sub-processes. `null` (the default) can be specified if no overlap resolver is required.", "optional": true, "schema": {"type": "object", "subtype": "process-graph", "minItems": 0.0, "deprecated": false, "parameters": [{"name": "x", "description": "The overlapping value from the first data cube `cube1`.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}, {"name": "y", "description": "The overlapping value from the second data cube `cube2`.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}, {"name": "context", "description": "Additional data passed by the user.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"minItems": 0.0, "deprecated": false, "description": "The value to be set in the merged data cube.", "schema": {}}}}, {"name": "context", "description": "Additional data to be passed to the overlap resolver.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"description": "The merged data cube. See the process description for details regarding the dimensions and dimension properties (name, type, labels, reference system and resolution).", "schema": {"type": "object"}}, "exceptions": {"OverlapResolverMissing": {"message": "Overlapping data cubes, but no overlap resolver has been specified.", "http": 400}}, "links": [{"rel": "about", "href": "https://en.wikipedia.org/wiki/Reduction_Operator", "title": "Background information on reduction operators (binary reducers) by Wikipedia"}]}, {"id": "mod", "summary": "Modulo", "description": "Remainder after a division of `x` by `y` for both integers and floating-point numbers.\n\nThe result of a modulo operation has the sign of the divisor. The handling regarding the sign of the result [differs between programming languages](https://en.wikipedia.org/wiki/Modulo_operation#In_programming_languages) and needs careful consideration to avoid unexpected results.\n\nThe no-data value `null` is passed through and therefore gets propagated if any of the arguments is `null`. A modulo by zero results in \u00b1infinity if the processing environment supports it. Otherwise, a `DivisionByZero` exception must the thrown.", "categories": ["math"], "parameters": [{"name": "x", "description": "A number to be used as the dividend.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "y", "description": "A number to be used as the divisor.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The remainder after division.", "schema": {"type": ["number", "null"]}}, "exceptions": {"DivisionByZero": {"message": "Division by zero is not supported.", "http": 400}}, "examples": [{"arguments": {"x": 27, "y": 5}, "returns": 2}, {"arguments": {"x": -27, "y": 5}, "returns": 3}, {"arguments": {"x": 3.14, "y": -2}, "returns": -0.86}, {"arguments": {"x": -27, "y": -5}, "returns": -2}, {"arguments": {"x": 27, "y": null}}, {"arguments": {"x": null, "y": 5}}], "links": [{"rel": "about", "href": "https://en.wikipedia.org/wiki/Modulo_operation", "title": "Modulo explained by Wikipedia"}]}, {"id": "multiply", "summary": "Multiplication of two numbers", "description": "Multiplies the two numbers `x` and `y` (*`x * y`*) and returns the computed product.\n\nNo-data values are taken into account so that `null` is returned if any element is such a value.\n\nThe computations follow [IEEE Standard 754](https://ieeexplore.ieee.org/document/8766229) whenever the processing environment supports it.", "categories": ["math"], "parameters": [{"name": "x", "description": "The multiplier.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "y", "description": "The multiplicand.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed product of the two numbers.", "schema": {"type": ["number", "null"]}}, "exceptions": {"MultiplicandMissing": {"message": "Multiplication requires at least two numbers.", "http": 400}}, "examples": [{"arguments": {"x": 5, "y": 2.5}, "returns": 12.5}, {"arguments": {"x": -2, "y": -4}, "returns": 8}, {"arguments": {"x": 1, "y": null}}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Product.html", "title": "Product explained by Wolfram MathWorld"}, {"rel": "about", "href": "https://ieeexplore.ieee.org/document/8766229", "title": "IEEE Standard 754-2019 for Floating-Point Arithmetic"}], "process_graph": {"product": {"process_id": "product", "result": true, "arguments": {"data": [{"from_parameter": "x"}, {"from_parameter": "y"}], "ignore_nodata": false}}}}, {"id": "ndvi", "summary": "Normalized Difference Vegetation Index", "description": "Computes the Normalized Difference Vegetation Index (NDVI). The NDVI is computed as *`(nir - red) / (nir + red)`*.\n\nThe `data` parameter expects a raster data cube with a dimension of type `bands` or a `DimensionAmbiguous` exception is thrown otherwise. By default, the dimension must have at least two bands with the common names `red` and `nir` assigned. Otherwise, the user has to specify the parameters `nir` and `red`. If neither is the case, either the exception `NirBandAmbiguous` or `RedBandAmbiguous` is thrown. The common names for each band are specified in the collection's band metadata and are *not* equal to the band names.\n\nBy default, the dimension of type `bands` is dropped by this process. To keep the dimension specify a new band name in the parameter `target_band`. This adds a new dimension label with the specified name to the dimension, which can be used to access the computed values. If a band with the specified name exists, a `BandExists` is thrown.\n\nThis process is very similar to the process ``normalized_difference()``, but determines the bands automatically based on the common names (`red`/`nir`) specified in the metadata.", "categories": ["math > indices", "vegetation indices"], "parameters": [{"name": "data", "description": "A raster data cube with two bands that have the common names `red` and `nir` assigned.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "nir", "description": "The name of the NIR band. Defaults to the band that has the common name `nir` assigned.\n\nEither the unique band name (metadata field `name` in bands) or one of the common band names (metadata field `common_name` in bands) can be specified. If the unique band name and the common name conflict, the unique band name has a higher priority.", "optional": true, "default": "nir", "schema": {"type": "string", "subtype": "band-name", "minItems": 0.0, "deprecated": false}}, {"name": "red", "description": "The name of the red band. Defaults to the band that has the common name `red` assigned.\n\nEither the unique band name (metadata field `name` in bands) or one of the common band names (metadata field `common_name` in bands) can be specified. If the unique band name and the common name conflict, the unique band name has a higher priority.", "optional": true, "default": "red", "schema": {"type": "string", "subtype": "band-name", "minItems": 0.0, "deprecated": false}}, {"name": "target_band", "description": "By default, the dimension of type `bands` is dropped. To keep the dimension specify a new band name in this parameter so that a new dimension label with the specified name will be added for the computed values.", "optional": true, "schema": [{"type": "string", "pattern": "^\\w+$", "minItems": 0.0, "deprecated": false}, {"type": "null", "minItems": 0.0, "deprecated": false}]}], "returns": {"description": "A raster data cube containing the computed NDVI values. The structure of the data cube differs depending on the value passed to `target_band`:\n\n* `target_band` is `null`: The data cube does not contain the dimension of type `bands`, the number of dimensions decreases by one. The dimension properties (name, type, labels, reference system and resolution) for all other dimensions remain unchanged.\n* `target_band` is a string: The data cube keeps the same dimensions. The dimension properties remain unchanged, but the number of dimension labels for the dimension of type `bands` increases by one. The additional label is named as specified in `target_band`.", "schema": {"type": "object"}}, "exceptions": {"NirBandAmbiguous": {"message": "The NIR band can't be resolved, please specify the specific NIR band name.", "http": 400}, "RedBandAmbiguous": {"message": "The red band can't be resolved, please specify the specific red band name.", "http": 400}, "DimensionAmbiguous": {"message": "dimension of type `bands` is not available or is ambiguous..", "http": 400}, "BandExists": {"message": "A band with the specified target name exists.", "http": 400}}, "links": [{"rel": "about", "href": "https://en.wikipedia.org/wiki/Normalized_difference_vegetation_index", "title": "NDVI explained by Wikipedia"}, {"rel": "about", "href": "https://earthobservatory.nasa.gov/features/MeasuringVegetation/measuring_vegetation_2.php", "title": "NDVI explained by NASA"}, {"rel": "about", "href": "https://github.com/radiantearth/stac-spec/tree/master/extensions/eo#common-band-names", "title": "List of common band names as specified by the STAC specification"}]}, {"id": "neq", "summary": "Not equal to comparison", "description": "Compares whether `x` is *not* strictly equal to `y`.\n\n**Remarks:**\n\n* Data types MUST be checked strictly. For example, a string with the content *1* is not equal to the number *1*. Nevertheless, an integer *1* is equal to a floating-point number *1.0* as `integer` is a sub-type of `number`.\n* If any operand is `null`, the return value is `null`. Therefore, `neq(null, null)` returns `null` instead of `false`.\n* If any operand is an array or object, the return value is `false`.\n* Strings are expected to be encoded in UTF-8 by default.\n* Temporal strings MUST be compared differently than other strings and MUST NOT be compared based on their string representation due to different possible representations. For example, the time zone representation `Z` (for UTC) has the same meaning as `+00:00`.", "categories": ["texts", "comparison"], "parameters": [{"name": "x", "description": "First operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "y", "description": "Second operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "delta", "description": "Only applicable for comparing two numbers. If this optional parameter is set to a positive non-zero number the non-equality of two numbers is checked against a delta value. This is especially useful to circumvent problems with floating-point inaccuracy in machine-based computation.\n\nThis option is basically an alias for the following computation: `gt(abs(minus([x, y]), delta)`", "optional": true, "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "case_sensitive", "description": "Only applicable for comparing two strings. Case sensitive comparison can be disabled by setting this parameter to `false`.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "`true` if `x` is *not* equal to `y`, `null` if any operand is `null`, otherwise `false`.", "schema": {"type": ["boolean", "null"]}}, "examples": [{"arguments": {"x": 1, "y": null}}, {"arguments": {"x": 1, "y": 1}, "returns": false}, {"arguments": {"x": 1, "y": "1"}, "returns": true}, {"arguments": {"x": 0, "y": false}, "returns": true}, {"arguments": {"x": 1.02, "y": 1, "delta": 0.01}, "returns": true}, {"arguments": {"x": -1, "y": -1.001, "delta": 0.01}, "returns": false}, {"arguments": {"x": 115, "y": 110, "delta": 10}, "returns": false}, {"arguments": {"x": "Test", "y": "test"}, "returns": true}, {"arguments": {"x": "Test", "y": "test", "case_sensitive": false}, "returns": false}, {"arguments": {"x": "\u00c4", "y": "\u00e4", "case_sensitive": false}, "returns": false}, {"arguments": {"x": "00:00:00+00:00", "y": "00:00:00Z"}, "returns": false}, {"description": "`y` is not a valid date-time representation and therefore will be treated as a string so that the provided values are not equal.", "arguments": {"x": "2018-01-01T12:00:00Z", "y": "2018-01-01T12:00:00"}, "returns": true}, {"description": "01:00 in the time zone +1 is equal to 00:00 in UTC.", "arguments": {"x": "2018-01-01T00:00:00Z", "y": "2018-01-01T01:00:00+01:00"}, "returns": false}, {"arguments": {"x": [1, 2, 3], "y": [1, 2, 3]}, "returns": false}], "process_graph": {"eq": {"process_id": "eq", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "y"}, "delta": {"from_parameter": "delta"}, "case_sensitive": {"from_parameter": "case_sensitive"}}}, "not": {"process_id": "not", "result": true, "arguments": {"x": {"from_node": "eq"}}}}}, {"id": "normalized_difference", "summary": "Normalized difference", "description": "Computes the normalized difference for two bands. The normalized difference is computed as *`(x - y) / (x + y)`*.\n\nThis process could be used for a number of remote sensing indices such as:\n\n* [NDVI](https://eos.com/ndvi/): `x` = NIR band, `y` = red band\n* [NDWI](https://eos.com/ndwi/): `x` = NIR band, `y` = SWIR band\n* [NDSI](https://eos.com/ndsi/): `x` = green band, `y` = SWIR band\n\nSome back-ends may have native processes such as ``ndvi()`` available for convenience.", "categories": ["math > indices", "vegetation indices"], "parameters": [{"name": "x", "description": "The value for the first band.", "schema": {"type": "number", "minItems": 0.0, "deprecated": false}}, {"name": "y", "description": "The value for the second band.", "schema": {"type": "number", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed normalized difference.", "schema": {"type": "number"}}, "links": [{"rel": "related", "href": "https://eos.com/ndvi/", "title": "NDVI explained by EOS"}, {"rel": "related", "href": "https://eos.com/ndwi/", "title": "NDWI explained by EOS"}, {"rel": "related", "href": "https://eos.com/ndsi/", "title": "NDSI explained by EOS"}], "process_graph": {"subtract": {"process_id": "subtract", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "y"}}}, "add": {"process_id": "add", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "y"}}}, "divide": {"process_id": "divide", "result": true, "arguments": {"x": {"from_node": "subtract"}, "y": {"from_node": "add"}}}}}, {"id": "order", "summary": "Create a permutation", "description": "Computes a permutation which allows rearranging the data into ascending or descending order. In other words, this process computes the ranked (sorted) element positions in the original list.\n\n**Remarks:**\n\n* The positions in the result are zero-based.\n* Ties will be left in their original ordering.\n* Temporal strings can *not* be compared based on their string representation due to the time zone/time-offset representations.", "categories": ["arrays", "sorting"], "parameters": [{"name": "data", "description": "An array to compute the order for.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "anyOf": [{"type": "number"}, {"type": "null"}, {"type": "string", "format": "date-time", "subtype": "date-time"}, {"type": "string", "format": "date", "subtype": "date"}, {"type": "string", "format": "time", "subtype": "time"}]}, "deprecated": false}}, {"name": "asc", "description": "The default sort order is ascending, with smallest values first. To sort in reverse (descending) order, set this parameter to `false`.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}, {"name": "nodata", "description": "Controls the handling of no-data values (`null`). By default, they are removed. If set to `true`, missing values in the data are put last; if set to `false`, they are put first.", "optional": true, "schema": {"type": ["boolean", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed permutation.", "schema": {"type": "array"}}, "examples": [{"arguments": {"data": [6, -1, 2, null, 7, 4, null, 8, 3, 9, 9]}, "returns": [1, 2, 8, 5, 0, 4, 7, 9, 10]}, {"arguments": {"data": [6, -1, 2, null, 7, 4, null, 8, 3, 9, 9], "nodata": true}, "returns": [1, 2, 8, 5, 0, 4, 7, 9, 10, 3, 6]}, {"arguments": {"data": [6, -1, 2, null, 7, 4, null, 8, 3, 9, 9], "asc": false, "nodata": true}, "returns": [9, 10, 7, 4, 0, 5, 8, 2, 1, 3, 6]}, {"arguments": {"data": [6, -1, 2, null, 7, 4, null, 8, 3, 9, 9], "asc": false, "nodata": false}, "returns": [3, 6, 9, 10, 7, 4, 0, 5, 8, 2, 1]}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Permutation.html", "title": "Permutation explained by Wolfram MathWorld"}]}, {"id": "pi", "summary": "Pi (\u03c0)", "description": "The real number Pi (\u03c0) is a mathematical constant that is the ratio of the circumference of a circle to its diameter. The numerical value is approximately *3.14159*.", "categories": ["math > constants", "math > trigonometric"], "parameters": [], "returns": {"description": "The numerical value of Pi.", "schema": {"type": "number"}}, "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Pi.html", "title": "Mathematical constant Pi explained by Wolfram MathWorld"}]}, {"id": "power", "summary": "Exponentiation", "description": "Computes the exponentiation for the base `base` raised to the power of `p`.\n\nThe no-data value `null` is passed through and therefore gets propagated if any of the arguments is `null`.", "categories": ["math", "math > exponential & logarithmic"], "parameters": [{"name": "base", "description": "The numerical base.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "p", "description": "The numerical exponent.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed value for `base` raised to the power of `p`.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"base": 0, "p": 2}, "returns": 0}, {"arguments": {"base": 2.5, "p": 0}, "returns": 1}, {"arguments": {"base": 3, "p": 3}, "returns": 27}, {"arguments": {"base": 5, "p": -1}, "returns": 0.2}, {"arguments": {"base": 1, "p": 0.5}, "returns": 1}, {"arguments": {"base": 1, "p": null}}, {"arguments": {"base": null, "p": 2}}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Power.html", "title": "Power explained by Wolfram MathWorld"}]}, {"id": "product", "summary": "Compute the product by multiplying numbers", "description": "Multiplies all elements in a sequential array of numbers and returns the computed product.\n\nBy default no-data values are ignored. Setting `ignore_nodata` to `false` considers no-data values so that `null` is returned if any element is such a value.\n\nThe computations follow [IEEE Standard 754](https://ieeexplore.ieee.org/document/8766229) whenever the processing environment supports it.", "categories": ["math", "reducer"], "parameters": [{"name": "data", "description": "An array of numbers.", "schema": {"type": "array", "minItems": 0.0, "items": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}, "deprecated": false}}, {"name": "ignore_nodata", "description": "Indicates whether no-data values are ignored or not. Ignores them by default. Setting this flag to `false` considers no-data values so that `null` is returned if any value is such a value.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed product of the sequence of numbers.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"data": [5, 0]}, "returns": 0}, {"arguments": {"data": [-2, 4, 2.5]}, "returns": -20}, {"arguments": {"data": [1, null], "ignore_nodata": false}}, {"arguments": {"data": [-1]}, "returns": -1}, {"arguments": {"data": [null], "ignore_nodata": false}}, {"arguments": {"data": []}}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Product.html", "title": "Product explained by Wolfram MathWorld"}, {"rel": "about", "href": "https://ieeexplore.ieee.org/document/8766229", "title": "IEEE Standard 754-2019 for Floating-Point Arithmetic"}]}, {"id": "array_append", "summary": "Append a value to an array", "description": "Appends a value to the end of the array. Array labels get discarded from the array.", "categories": ["arrays"], "parameters": [{"name": "data", "description": "An array.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}, {"name": "value", "description": "Value to append to the array.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}], "returns": {"description": "The new array with the value being appended.", "schema": {"type": "array"}}, "experimental": true, "examples": [{"arguments": {"data": [1, 2], "value": 3}, "returns": [1, 2, 3]}], "process_graph": {"append": {"process_id": "array_concat", "result": true, "arguments": {"array1": {"from_parameter": "data"}, "array2": [{"from_parameter": "value"}]}}}}, {"id": "array_concat", "summary": "Merge two arrays", "description": "Concatenates two arrays into a single array by appending the second array to the first array. Array labels get discarded from both arrays before merging.", "categories": ["arrays"], "parameters": [{"name": "array1", "description": "The first array.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}, {"name": "array2", "description": "The second array.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}], "returns": {"description": "The merged array.", "schema": {"type": "array"}}, "experimental": true, "examples": [{"description": "Concatenates two arrays containing different data type.", "arguments": {"array1": ["a", "b"], "array2": [1, 2]}, "returns": ["a", "b", 1, 2]}]}, {"id": "array_create", "summary": "Create an array", "description": "Creates a new array, which by default is empty.\n\nThe second parameter `repeat` allows to add the given array multiple times to the new array.\n\nIn most cases you can simply pass a (native) array to processes directly, but this process is especially useful to create a new array that is getting returned by a child process, for example in ``apply_dimension()``.", "categories": ["arrays"], "parameters": [{"name": "data", "description": "A (native) array to fill the newly created array with. Defaults to an empty array.", "optional": true, "default": [], "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}, {"name": "repeat", "description": "The number of times the (native) array specified in `data` is repeatedly added after each other to the new array being created. Defaults to `1`.", "optional": true, "default": 1, "schema": {"type": "integer", "minimum": 1.0, "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The newly created array.", "schema": {"type": "array"}}, "experimental": true, "examples": [{"arguments": {}, "returns": []}, {"arguments": {"data": ["this", "is", "a", "test"]}, "returns": ["this", "is", "a", "test"]}, {"arguments": {"data": [null], "repeat": 3}, "returns": [null, null, null]}, {"arguments": {"data": [1, 2, 3], "repeat": 2}, "returns": [1, 2, 3, 1, 2, 3]}]}, {"id": "array_modify", "summary": "Change the content of an array (remove, insert, update)", "description": "Modify an array by removing, inserting or updating elements. Updating can be seen as removing elements followed by inserting new elements (not necessarily the same number).\n\nAll labels get discarded and the array indices are always a sequence of numbers with the step size of 1 and starting at 0.", "categories": ["arrays"], "parameters": [{"name": "data", "description": "The array to modify.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}, {"name": "values", "description": "The values to insert into the `data` array.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}, {"name": "index", "description": "The index in the `data` array of the element to insert the value(s) before. If the index is greater than the number of elements in the `data` array, the process throws an `ArrayElementNotAvailable` exception.\n\nTo insert after the last element, there are two options:\n\n1. Use the simpler processes ``array_append()`` to append a single value or ``array_concat()`` to append multiple values.\n2. Specify the number of elements in the array. You can retrieve the number of elements with the process ``count()``, having the parameter `condition` set to `true`.", "schema": {"type": "integer", "minimum": 0.0, "minItems": 0.0, "deprecated": false}}, {"name": "length", "description": "The number of elements in the `data` array to remove (or replace) starting from the given index. If the array contains fewer elements, the process simply removes all elements up to the end.", "optional": true, "default": 1, "schema": {"type": "integer", "minimum": 0.0, "minItems": 0.0, "deprecated": false}}], "returns": {"description": "An array with values added, updated or removed.", "schema": {"type": "array"}}, "experimental": true, "exceptions": {"ArrayElementNotAvailable": {"message": "The array can't be modified as the given index is larger than the number of elements in the array.", "http": 400}}, "examples": [{"description": "Replace a single value in the array.", "arguments": {"data": ["a", "d", "c"], "values": ["b"], "index": 1}, "returns": ["a", "b", "c"]}, {"description": "Replace multiple values in the array.", "arguments": {"data": ["a", "b", 4, 5], "values": [1, 2, 3], "index": 0, "length": 2}, "returns": [1, 2, 3, 4, 5]}, {"description": "Insert a value to the array at a given position.", "arguments": {"data": ["a", "c"], "values" inItems": 0.0, "deprecated": false}}], "returns": {"description": "A data cube with the optimal values for the parameters.", "schema": {"type": "object"}}, "experimental": true, "exceptions": {"InvalidValues": {"message": "At least one of the values is not a finite number.", "http": 400}, "DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}}}, {"id": "inspect", "summary": "Add information to the logs", "description": "This process can be used to add runtime information to the logs, e.g. for debugging purposes. This process should be used with caution and it is recommended to remove the process in production workflows. For example, logging each pixel or array individually in a process such as ``apply()`` or ``reduce_dimension()`` could lead to a (too) large number of log entries. Several data structures (e.g. data cubes) are too large to log and will only return summaries of their contents.\n\nThe data provided in the parameter `data` is returned without changes.", "categories": ["development"], "parameters": [{"name": "data", "description": "Data to log.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "code", "description": "A label to help identify one or more log entries originating from this process in the list of all log entries. It can help to group or filter log entries and is usually not unique.", "optional": true, "default": "User", "schema": {"type": "string", "minItems": 0.0, "deprecated": false}}, {"name": "level", "description": "The severity level of this message, defaults to `info`.", "optional": true, "default": "info", "schema": {"type": "string", "enum": ["error", "warning", "info", "debug"], "minItems": 0.0, "deprecated": false}}, {"name": "message", "description": "A message to send in addition to the data.", "optional": true, "default": "", "schema": {"type": "string", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The data as passed to the `data` parameter without any modification.", "schema": {}}, "experimental": true}, {"id": "is_infinite", "summary": "Value is an infinite number", "description": "Checks whether the specified value `x` is an infinite number. The definition of infinite numbers follows the [IEEE Standard 754](https://ieeexplore.ieee.org/document/4610935). The special numerical value `NaN` (not a number) as defined by the [IEEE Standard 754](https://ieeexplore.ieee.org/document/4610935) is not an infinite number and must return `false`.", "categories": ["comparison"], "parameters": [{"name": "x", "description": "The data to check.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}], "returns": {"description": "`true` if the data is an infinite number, otherwise `false`.", "schema": {"type": "boolean"}}, "experimental": true, "links": [{"rel": "about", "href": "https://ieeexplore.ieee.org/document/4610935", "title": "IEEE Standard 754-2008 for Floating-Point Arithmetic"}]}, {"id": "nan", "summary": "Not a Number (NaN)", "description": "`NaN` (not a number) is a symbolic floating-point representation which is neither a signed infinity nor a finite number.", "categories": ["math > constants"], "parameters": [], "returns": {"description": "Returns `NaN`.", "schema": {}}, "experimental": true, "links": [{"rel": "about", "href": "https://ieeexplore.ieee.org/document/4610935", "title": "IEEE Standard 754-2008 for Floating-Point Arithmetic"}, {"rel": "about", "href": "http://mathworld.wolfram.com/NaN.html", "title": "NaN explained by Wolfram MathWorld"}]}, {"id": "predict_curve", "summary": "Predict values", "description": "Predict values using a model function and pre-computed parameters. The process is primarily intended to compute values for new labels, but it can also fill gaps where existing labels contain no-data (`null`) values.", "categories": ["cubes", "math"], "parameters": [{"name": "data", "description": "A data me", "subtype": "date-time"}]}, "deprecated": false}]}], "returns": {"description": "A data cube with the predicted values.", "schema": {"type": "object"}}, "experimental": true, "exceptions": {"DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}}}, {"id": "reduce_spatial", "summary": "Reduce spatial dimensions 'x' and 'y'", "description": "Applies a reducer to a data cube by collapsing all the pixel values along the horizontal spatial dimensions (i.e. axes `x` and `y`) into an output value computed by the reducer. The horizontal spatial dimensions are dropped.\n\nAn aggregation over certain spatial areas can be computed with the process ``aggregate_spatial()``.\n\nThis process passes a list of values to the reducer. The list of values has an undefined order, therefore processes such as ``last()`` and ``first()`` that depend on the order of the values will lead to unpredictable results.", "categories": ["aggregate & resample", "cubes", "reducer"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "reducer", "description": "A reducer to apply on the horizontal spatial dimensions. A reducer is a single process such as ``mean()`` or a set of processes, which computes a single value for a list of values, see the category 'reducer' for such processes.", "schema": {"type": "object", "subtype": "process-graph", "minItems": 0.0, "deprecated": false, "parameters": [{"name": "data", "description": "An array with elements of any type.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}, "deprecated": false}}, {"name": "context", "description": "Additional data passed by the user.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"minItems": 0.0, "deprecated": false, "description": "The value to be set in the new data cube.", "schema": {}}}}, {"name": "context", "description": "Additional data to be passed to the reducer.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"description": "A data cube with the newly computed values. It is missing the horizontal spatial dimensions, the number of dimensions decreases by two. The dimension properties (name, type, labels, reference system and resolution) for all other dimensions remain unchanged.", "schema": {"type": "object"}}, "experimental": true, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#reduce", "title": "Reducers explained in the openEO documentation"}]}, {"id": "quantiles", "summary": "Quantiles", "description": "Calculates quantiles, which are cut points dividing the range of a sample distribution into either\n\n* intervals corresponding to the given `probabilities` or\n* equal-sized intervals (q-quantiles based on the parameter `q`).\n\nEither the parameter `probabilities` or `q` must be specified, otherwise the `QuantilesParameterMissing` exception is thrown. If both parameters are set the `QuantilesParameterConflict` exception is thrown.\n\nSample quantiles can be computed with several different algorithms. Hyndman and Fan (1996) have concluded on nine different types, which are commonly implemented in statistical software packages. This process is implementing type 7, which is implemented widely and often also the default type (e.g. in Excel, Julia, Python, R and S).", "categories": ["math > statistics"], "parameters": [{"name": "data", "description": "An array of numbers.", "schema": {"type": "array", "minItems": 0.0, "items": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}, "deprecated": false}}, {"name": "probabilities", "description": "A list of probabilities to calculate quantiles for. The probabilities must be between 0 and 1 (inclusive).", "optional": true, "schema": {"type": "array", "minItems": 0.0, "items": {"type": "number", "minimum": 0.0, "maximum": 1.0, "minItems": 0.0, "deprecated": false}, "deprecated": false}}, {"name": "q", "description": "Number of intervals to calculate quantiles for. Calculates q-quantiles with equal-sized intervals.", "optional": true, "schema": {"type": "integer", "minimum": 2.0, "minItems": 0.0, "deprecated": false}}, {"name": "ignore_nodata", "description": "Indicates whether no-data values are ignored or not. Ignores them by default. Setting this flag to `false` considers no-data values so that an array with `null` values is returned if any element is such a value.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "An array with the computed quantiles. The list has either\n\n* as many elements as the given list of `probabilities` had or\n* *`q`-1* elements.\n\nIf the input array is empty the resulting array is filled with as many `null` values as required according to the list above. See the 'Empty array' example for an example.", "schema": {"type": "array"}}, "exceptions": {"QuantilesParameterMissing": {"message": "The process `quantiles` requires either the `probabilities` or `q` parameter to be set.", "http": 400}, "QuantilesParameterConflict": {"message": "The process `quantiles` only allows that either the `probabilities` or the `q` parameter is set.", "http": 400}}, "examples": [{"arguments": {"data": [2, 4, 4, 4, 5, 5, 7, 9], "probabilities": [0.005, 0.01, 0.02, 0.05, 0.1, 0.5]}, "returns": [2.07, 2.14, 2.28, 2.7, 3.4, 4.5]}, {"arguments": {"data": [2, 4, 4, 4, 5, 5, 7, 9], "q": 4}, "returns": [4, 4.5, 5.5]}, {"arguments": {"data": [-1, -0.5, null, 1], "q": 2}, "returns": [-0.5]}, {"arguments": {"data": [-1, -0.5, null, 1], "q": 4, "ignore_nodata": false}, "returns": [null, null, null]}, {"title": "Empty array", "arguments": {"data": [], "probabilities": [0.1, 0.5]}, "returns": [null, null]}], "links": [{"rel": "about", "href": "https://en.wikipedia.org/wiki/Quantile", "title": "Quantiles explained by Wikipedia"}, {"rel": "about", "href": "https://www.amherst.edu/media/view/129116/original/Sample+Quantiles.pdf", "type": "application/pdf", "title": "Hyndman and Fan (1996): Sample Quantiles in Statistical Packages"}]}, {"id": "rearrange", "summary": "Rearrange an array based on a permutation", "description": "Rearranges an array based on a permutation, i.e. a ranked list of element positions in the original list. The positions must be zero-based.", "categories": ["arrays", "sorting"], "parameters": [{"name": "data", "description": "The array to rearrange.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}, {"name": "order", "description": "The permutation used for rearranging.", "schema": {"type": "array", "minItems": 0.0, "items": {"type": "integer", "minimum": 0.0, "minItems": 0.0, "deprecated": false}, "deprecated": false}}], "returns": {"description": "The rearranged array.", "schema": {"type": "array"}}, "examples": [{"title": "Reverse a list", "arguments": {"data": [5, 4, 3], "order": [2, 1, 0]}, "returns": [3, 4, 5]}, {"title": "Remove two elements", "arguments": {"data": [5, 4, 3, 2], "order": [1, 3]}, "returns": [4, 2]}, {"title": "Swap two elements", "arguments": {"data": [5, 4, 3, 2], "order": [0, 2, 1, 3]}, "returns": [5, 3, 4, 2]}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Permutation.html", "title": "Permutation explained by Wolfram MathWorld"}]}, {"id": "reduce_dimension", "summary": "Reduce dimensions", "description": "Applies a reducer to a data cube dimension by collapsing all the pixel values along the specified dimension into an output value computed by the reducer.\n\nThe dimension is dropped. To avoid this, use ``apply_dimension()`` instead.", "categories": ["cubes", "reducer"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "reducer", "description": "A reducer to apply on the specified dimension. A reducer is a single process such as ``mean()`` or a set of processes, which computes a single value for a list of values, see the category 'reducer' for such processes.", "schema": {"type": "object", "subtype": "process-graph", "minItems": 0.0, "deprecated": false, "parameters": [{"name": "data", "description": "A labeled array with elements of any type.", "schema": {"type": "array", "subtype": "labeled-array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}, "deprecated": false}}, {"name": "context", "description": "Additional data passed by the user.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"minItems": 0.0, "deprecated": false, "description": "The value to be set in the new data cube.", "schema": {}}}}, {"name": "dimension", "description": "The name of the dimension over which to reduce. Fails with a `DimensionNotAvailable` exception if the specified dimension does not exist.", "schema": {"type": "string", "minItems": 0.0, "deprecated": false}}, {"name": "context", "description": "Additional data to be passed to the reducer.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"description": "A data cube with the newly computed values. It is missing the given dimension, the number of dimensions decreases by one. The dimension properties (name, type, labels, reference system and resolution) for all other dimensions remain unchanged.", "schema": {"type": "object"}}, "exceptions": {"DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#reduce", "title": "Reducers explained in the openEO documentation"}]}, {"id": "resample_cube_spatial", "summary": "Resample the spatial dimensions to match a target data cube", "description": "Resamples the spatial dimensions (x,y) from a source data cube to align with the corresponding dimensions of the given target data cube. Returns a new data cube with the resampled dimensions.\n\nTo resample a data cube to a specific resolution or projection regardless of an existing target data cube, refer to ``resample_spatial()``.", "categories": ["cubes", "aggregate & resample"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "target", "description": "A data cube that describes the spatial target resolution.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "method", "description": "Resampling method to use. The following options are available and are meant to align with [`gdalwarp`](https://gdal.org/programs/gdalwarp.html#cmdoption-gdalwarp-r):\n\n* `average`: average (mean) resampling, computes the weighted average of all valid pixels\n* `bilinear`: bilinear resampling\n* `cubic`: cubic resampling\n* `cubicspline`: cubic spline resampling\n* `lanczos`: Lanczos windowed sinc resampling\n* `max`: maximum resampling, selects the maximum value from all valid pixels\n* `med`: median resampling, selects the median value of all valid pixels\n* `min`: minimum resampling, selects the minimum value from all valid pixels\n* `mode`: mode resampling, selects the value which appears most often of all the sampled points\n* `near`: nearest neighbour resampling (default)\n* `q1`: first quartile resampling, selects the first quartile value of all valid pixels\n* `q3`: third quartile resampling, selects the third quartile value of all valid pixels\n* `rms` root mean square (quadratic mean) of all valid pixels\n* `sum`: compute the weighted sum of all valid pixels\n\nValid pixels are determined based on the function ``is_valid()``.", "optional": true, "default": "near", "schema": {"type": "string", "enum": ["average", "bilinear", "cubic", "cubicspline", "lanczos", "max", "med", "min", "mode", "near", "q1", "q3", "rms", "sum"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "A data cube with the same dimensions. The dimension properties (name, type, labels, reference system and resolution) remain unchanged, except for the resolution and dimension labels of the spatial dimensions.", "schema": {"type": "object"}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#resample", "title": "Resampling explained in the openEO documentation"}]}, {"id": "resample_spatial", "summary": "Resample and warp the spatial dimensions", "description": "Resamples the spatial dimensions (x,y) of the data cube to a specified resolution and/or warps the data cube to the target projection. At least `resolution` or `projection` must be specified.\n\nRelated processes:\n\n* Use ``filter_bbox()`` to set the target spatial extent.\n* To spatially align two data cubes with each other (e.g. for merging), better use the process ``resample_cube_spatial()``.", "categories": ["cubes", "aggregate & resample"], "parameters": [{"name": "data", "description": "A raster data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "resolution", "description": "Resamples the data cube to the target resolution, which can be specified either as separate values for x and y or as a single value for both axes. Specified in the units of the target projection. Doesn't change the resolution by default (`0`).", "optional": true, "default": 0, "schema": [{"type": "number", "minimum": 0.0, "minItems": 0.0, "deprecated": false, "description": "A single number used as the resolution for both x and ecified by the second operand. The left side is filled based on the sign bit (for signed integers) or with zeros (for unsigned integers).\n\nThis operation effectively divides the integer by `2^y`, where `y` is the number of positions to shift, rounding down to the nearest integer.\n\n**Example bitwise right shift operation:**\n\n```\n  a = 5   (binary: 0101)\n  b = 1   (shift by 1)\n  a >> b = 2 (binary: 0010)\n```", "categories": ["bitwise"], "parameters": [{"name": "x", "description": "An integer value to be shifted.", "schema": {"type": "integer", "minItems": 0.0, "deprecated": false}}, {"name": "y", "description": "The number of positions to shift the bits to the right.", "schema": {"type": "integer", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "Integer result of the bitwise right shift.", "schema": {"type": "integer"}}, "experimental": true, "examples": [{"arguments": {"x": 5, "y": 1}, "returns": 2}, {"arguments": {"x": 8, "y": 2}, "returns": 2}, {"arguments": {"x": 32, "y": 3}, "returns": 4}], "process_graph": {"bitwise_right_shift": {"process_id": "bitwise_right_shift", "result": true, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "y"}}}}}]}</script>
