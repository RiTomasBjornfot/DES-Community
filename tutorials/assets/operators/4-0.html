        <script type="application/json">{"show-graph": true, "provide-download": false, "processes": [{"id": "absolute", "summary": "Absolute value", "description": "Computes the absolute value of a real number `x`, which is the \"unsigned\" portion of x and often denoted as *|x|*.\n\nThe no-data value `null` is passed through and therefore gets propagated.", "categories": ["math"], "parameters": [{"name": "x", "description": "A number.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed absolute value.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 0}, "returns": 0}, {"arguments": {"x": 3.5}, "returns": 3.5}, {"arguments": {"x": -0.4}, "returns": 0.4}, {"arguments": {"x": -3.5}, "returns": 3.5}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/AbsoluteValue.html", "title": "Absolute value explained by Wolfram MathWorld"}], "process_graph": {"lt": {"process_id": "lt", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": 0}}, "multiply": {"process_id": "multiply", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": -1}}, "if": {"process_id": "if", "result": true, "arguments": {"value": {"from_node": "lt"}, "accept": {"from_node": "multiply"}, "reject": {"from_parameter": "x"}}}}}, {"id": "add_dimension", "summary": "Add a new dimension", "description": "Adds a new named dimension to the data cube.\n\nAfterwards, the dimension can be referred to with the specified `name`. If a dimension with the specified name exists, the process fails with a `DimensionExists` exception. The dimension label of the dimension is set to the specified `label`.", "categories": ["cubes"], "parameters": [{"name": "data", "description": "A data cube to add the dimension to.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "name", "description": "Name for the dimension.", "schema": {"type": "string", "minItems": 0.0, "deprecated": false}}, {"name": "label", "description": "A dimension label.", "schema": [{"type": "number", "minItems": 0.0, "deprecated": false}, {"type": "string", "minItems": 0.0, "deprecated": false}]}, {"name": "type", "description": "The type of dimension, defaults to `other`.", "optional": true, "default": "other", "schema": {"type": "string", "enum": ["spatial", "temporal", "bands", "other"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The data cube with a newly added dimension. The new dimension has exactly one dimension label. All other dimensions remain unchanged.", "schema": {"type": "object"}}, "exceptions": {"DimensionExists": {"message": "A dimension with the specified name already exists.", "http": 400}}}, {"id": "add", "summary": "Addition of two numbers", "description": "Sums up the two numbers `x` and `y` (*`x + y`*) and returns the computed sum.\n\nNo-data values are taken into account so that `null` is returned if any element is such a value.\n\nThe computations follow [IEEE Standard 754](https://ieeexplore.ieee.org/document/8766229) whenever the processing environment supports it.", "categories": ["math"], "parameters": [{"name": "x", "description": "The first summand.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "y", "description": "The second summand.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed sum of the two numbers.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 5, "y": 2.5}, "returns": 7.5}, {"arguments": {"x": -2, "y": -4}, "returns": -6}, {"arguments": {"x": 1, "y": null}}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Sum.html", "title": "Sum explained by Wolfram MathWorld"}, {"rel": "about", "href": "https://ieeexplore.ieee.org/document/8766229", "title": "IEEE Standard 754-2019 for Floating-Point Arithmetic"}], "process_graph": {"sum": {"process_id": "sum", "result": true, "arguments": {"data": [{"from_parameter": "x"}, {"from_parameter": "y"}], "ignore_nodata": false}}}}, {"id": "aggregate_spatial", "summary": "Zonal statistics for geometries", "description": "Aggregates statistics for one or more geometries (e.g. zonal statistics for polygons) over the spatial dimensions. The number of total and valid pixels is returned together with the calculated values.\n\nAn 'unbounded' aggregation over the full extent of the horizontal spatial dimensions can be computed with the process ``reduce_spatial()``.\n\nThis process passes a list of values to the reducer. The list of values has an undefined order, therefore processes such as ``last()`` and ``first()`` that depend on the order of the values will lead to unpredictable results.", "categories": ["cubes", "aggregate & resample"], "parameters": [{"name": "data", "description": "A raster data cube.\n\nThe data cube must have been reduced to only contain two spatial dimensions and a third dimension the values are aggregated for, for example the temporal dimension to get a time series. Otherwise, this process fails with the `TooManyDimensions` exception.\n\nThe data cube implicitly gets restricted to the bounds of the geometries as if ``filter_spatial()`` would have been used with the same values for the corresponding parameters immediately before this process.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "geometries", "description": "Geometries as GeoJSON on which the aggregation will be based.\n\nOne value will be computed per GeoJSON `Feature`, `Geometry` or `GeometryCollection`. For a `FeatureCollection` multiple values will be computed, one value per contained `Feature`. For example, a single value will be computed for a `MultiPolygon`, but two values will be computed for a `FeatureCollection` containing two polygons.\n\n- For **polygons**, the process considers all pixels for which the point at the pixel center intersects with the corresponding polygon (as defined in the Simple Features standard by the OGC).\n- For **points**, the process considers the closest pixel center.\n- For **lines** (line strings), the process considers all the pixels whose centers are closest to at least one point on the line.\n\nThus, pixels may be part of multiple geometries and be part of multiple aggregations.\n\nTo maximize interoperability, a nested `GeometryCollection` should be avoided. Furthermore, a `GeometryCollection` composed of a single type of geometries should be avoided in favour of the corresponding multi-part type (e.g. `MultiPolygon`).", "schema": {"type": "object", "subtype": "geojson", "minItems": 0.0, "deprecated": false}}, {"name": "reducer", "description": "A reducer to be applied on all values of each geometry. A reducer is a single process such as ``mean()`` or a set of processes, which computes a single value for a list of values, see the category 'reducer' for such processes.", "schema": {"type": "object", "subtype": "process-graph", "minItems": 0.0, "deprecated": false, "parameters": [{"name": "data", "description": "An array with elements of any type.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}, "deprecated": false}}, {"name": "context", "description": "Additional data passed by the user.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"minItems": 0.0, "deprecated": false, "description": "The value to be set in the vector data cube.", "schema": {}}}}, {"name": "target_dimension", "description": "The new dimension name to be used for storing the results. Defaults to `result`.", "optional": true, "default": "result", "schema": {"type": "string", "minItems": 0.0, "deprecated": false}}, {"name": "context", "description": "Additional data to be passed to the reducer.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"description": "A vector data cube with the computed results and restricted to the bounds of the geometries.\n\nThe computed value is used for the dimension with the name that was specified in the parameter `target_dimension`.\n\nThe computation also stores information about the total count of pixels (valid + invalid pixels) and the number of valid pixels (see ``is_valid()``) for each geometry. These values are added as a new dimension with a dimension name derived from `target_dimension` by adding the suffix `_meta`. The new dimension has the dimension labels `total_count` and `valid_count`.", "schema": {"type": "object"}}, "exceptions": {"TooManyDimensions": {"message": "The number of dimensions must be reduced to three for `aggregate_spatial`.", "http": 400}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#aggregate", "title": "Aggregation explained in the openEO documentation"}, {"rel": "about", "href": "http://www.opengeospatial.org/standards/sfa", "title": "Simple Features standard by the OGC"}]}, {"id": "aggregate_temporal_period", "summary": "Temporal aggregations based on calendar hierarchies", "description": "Computes a temporal aggregation based on calendar hierarchies such as years, months or seasons. For other calendar hierarchies ``aggregate_temporal()`` can be used.\n\nFor each interval, all data along the dimension will be passed through the reducer.\n\nIf the dimension is not set or is set to `null`, the data cube is expected to only have one temporal dimension.", "categories": ["aggregate & resample", "climatology", "cubes"], "parameters": [{"name": "data", "description": "The source data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "period", "description": "The time intervals to aggregate. The following pre-defined values are available:\n\n* `hour`: Hour of the day\n* `day`: Day of the year\n* `week`: Week of the year\n* `dekad`: Ten day periods, counted per year with three periods per month (day 1 - 10, 11 - 20 and 21 - end of month). The third dekad of the month can range from 8 to 11 days. For example, the fourth dekad is Feb, 1 - Feb, 10 each year.\n* `month`: Month of the year\n* `season`: Three month periods of the calendar seasons (December - February, March - May, June - August, September - November).\n* `tropical-season`: Six month periods of the tropical seasons (November - April, May - October).\n* `year`: Proleptic years\n* `decade`: Ten year periods ([0-to-9 decade](https://en.wikipedia.org/wiki/Decade#0-to-9_decade)), from a year ending in a 0 to the next year ending in a 9.\n* `decade-ad`: Ten year periods ([1-to-0 decade](https://en.wikipedia.org/wiki/Decade#1-to-0_decade)) better aligned with the anno Domini (AD) calendar era, from a year ending in a 1 to the next year ending in a 0.", "schema": {"type": "string", "enum": ["hour", "day", "week", "dekad", "month", "season", "tropical-season", "year", "decade", "decade-ad"], "minItems": 0.0, "deprecated": false}}, {"name": "reducer", "description": "A reducer to be applied for the values contained in each period. A reducer is a single process such as ``mean()`` or a set of processes, which computes a single value for a list of values, see the category 'reducer' for such processes. Periods may not contain any values, which for most reducers leads to no-data (`null`) values by default.", "schema": {"type": "object", "subtype": "process-graph", "minItems": 0.0, "deprecated": false, "parameters": [{"name": "data", "description": "A labeled array with elements of any type. If there's no data for the period, the array is empty.", "schema": {"type": "array", "subtype": "labeled-array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}, "deprecated": false}}, {"name": "context", "description": "Additional data passed by the user.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"minItems": 0.0, "deprecated": false, "description": "The value to be set in the new data cube.", "schema": {}}}}, {"name": "dimension", "description": "The name of the temporal dimension for aggregation. All data along the dimension is passed through the specified reducer. If the dimension is not set or set to `null`, the source data cube is expected to only have one temporal dimension. Fails with a `TooManyDimensions` exception if it has more dimensions. Fails with a `DimensionNotAvailable` exception if the specified dimension does not exist.", "optional": true, "schema": {"type": ["string", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "context", "description": "Additional data to be passed to the reducer.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"description": "A new data cube with the same dimensions. The dimension properties (name, type, labels, reference system and resolution) remain unchanged, except for the resolution and dimension labels of the given temporal dimension. The specified temporal dimension has the following dimension labels (`YYYY` = four-digit year, `MM` = two-digit month, `DD` two-digit day of month):\n\n* `hour`: `YYYY-MM-DD-00` - `YYYY-MM-DD-23`\n* `day`: `YYYY-001` - `YYYY-365`\n* `week`: `YYYY-01` - `YYYY-52`\n* `dekad`: `YYYY-00` - `YYYY-36`\n* `month`: `YYYY-01` - `YYYY-12`\n* `season`: `YYYY-djf` (December - February), `YYYY-mam` (March - May), `YYYY-jja` (June - August), `YYYY-son` (September - November).\n* `tropical-season`: `YYYY-ndjfma` (November - April), `YYYY-mjjaso` (May - October).\n* `year`: `YYYY`\n* `decade`: `YYY0`\n* `decade-ad`: `YYY1`\n\nThe dimension labels in the new data cube are complete for the whole extent of the source data cube. For example, if `period` is set to `day` and the source data cube has two dimension labels at the beginning of the year (`2020-01-01`) and the end of a year (`2020-12-31`), the process returns a data cube with 365 dimension labels (`2020-001`, `2020-002`, ..., `2020-365`). In contrast, if `period` is set to `day` and the source data cube has just one dimension label `2020-01-05`, the process returns a data cube with just a single dimension label (`2020-005`).", "schema": {"type": "object"}}, "exceptions": {"TooManyDimensions": {"message": "The data cube contains multiple temporal dimensions. The parameter `dimension` must be specified.", "http": 400}, "DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}, "DistinctDimensionLabelsRequired": {"message": "The dimension labels have duplicate values. Distinct labels must be specified.", "http": 400}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#aggregate", "title": "Aggregation explained in the openEO documentation"}]}, {"id": "aggregate_temporal", "summary": "Temporal aggregations", "description": "Computes a temporal aggregation based on an array of temporal intervals.\n\nFor common regular calendar hierarchies such as year, month, week or seasons ``aggregate_temporal_period()`` can be used. Other calendar hierarchies must be transformed into specific intervals by the clients.\n\nFor each interval, all data along the dimension will be passed through the reducer.\n\nThe computed values will be projected to the labels. If no labels are specified, the start of the temporal interval will be used as label for the corresponding values. In case of a conflict (i.e. the user-specified values for the start times of the temporal intervals are not distinct), the user-defined labels must be specified in the parameter `labels` as otherwise a `DistinctDimensionLabelsRequired` exception would be thrown. The number of user-defined labels and the number of intervals need to be equal.\n\nIf the dimension is not set or is set to `null`, the data cube is expected to only have one temporal dimension.", "categories": ["cubes", "aggregate & resample"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "intervals", "description": "Left-closed temporal intervals, which are allowed to overlap. Each temporal interval in the array has exactly two elements:\n\n1. The first element is the start of the temporal interval. The specified instance in time is **included** in the interval.\n2. The second element is the end of the temporal interval. The specified instance in time is **excluded** from the interval.\n\nThe specified temporal strings follow [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339.html). Although [RFC 3339 prohibits the hour to be '24'](https://www.rfc-editor.org/rfc/rfc3339.html#section-5.7), **this process allows the value '24' for the hour** of an end time in order to make it possible that left-closed time intervals can fully cover the day.", "schema": {"type": "array", "subtype": "temporal-intervals", "minItems": 1.0, "items": {"type": "array", "subtype": "temporal-interval", "minItems": 2.0, "maxItems": 2.0, "items": {"minItems": 0.0, "deprecated": false, "anyOf": [{"type": "string", "format": "date-time", "subtype": "date-time"}, {"type": "string", "format": "date", "subtype": "date"}, {"type": "string", "format": "time", "subtype": "time"}, {"type": "string", "subtype": "year", "minLength": 4, "maxLength": 4, "pattern": "^\\d{4}$"}, {"type": "null"}]}, "deprecated": false}, "deprecated": false, "examples": [[["2015-01-01", "2016-01-01"], ["2016-01-01", "2017-01-01"], ["2017-01-01", "2018-01-01"]], [["00:00:00Z", "12:00:00Z"], ["12:00:00Z", "24:00:00Z"]]]}}, {"name": "reducer", "description": "A reducer to be applied for the values contained in each interval. A reducer is a single process such as ``mean()`` or a set of processes, which computes a single value for a list of values, see the category 'reducer' for such processes. Intervals may not contain any values, which for most reducers leads to no-data (`null`) values by default.", "schema": {"type": "object", "subtype": "process-graph", "minItems": 0.0, "deprecated": false, "parameters": [{"name": "data", "description": "A labeled array with elements of any type. If there's no data for the interval, the array is empty.", "schema": {"type": "array", "subtype": "labeled-array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}, "deprecated": false}}, {"name": "context", "description": "Additional data passed by the user.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"minItems": 0.0, "deprecated": false, "description": "The value to be set in the new data cube.", "schema": {}}}}, {"name": "labels", "description": "Distinct labels for the intervals, which can contain dates and/or times. Is only required to be specified if the values for the start of the temporal intervals are not distinct and thus the default labels would not be unique. The number of labels and the number of groups need to be equal.", "optional": true, "default": [], "schema": {"type": "array", "minItems": 0.0, "items": {"type": ["number", "string"], "minItems": 0.0, "deprecated": false}, "deprecated": false}}, {"name": "dimension", "description": "The name of the temporal dimension for aggregation. All data along the dimension is passed through the specified reducer. If the dimension is not set or set to `null`, the data cube is expected to only have one temporal dimension. Fails with a `TooManyDimensions` exception if it has more dimensions. Fails with a `DimensionNotAvailable` exception if the specified dimension does not exist.", "optional": true, "schema": {"type": ["string", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "context", "description": "Additional data to be passed to the reducer.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"description": "A new data cube with the same dimensions. The dimension properties (name, type, labels, reference system and resolution) remain unchanged, except for the resolution and dimension labels of the given temporal dimension.", "schema": {"type": "object"}}, "exceptions": {"TooManyDimensions": {"message": "The data cube contains multiple temporal dimensions. The parameter `dimension` must be specified.", "http": 400}, "DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}, "DistinctDimensionLabelsRequired": {"message": "The dimension labels have duplicate values. Distinct labels must be specified.", "http": 400}}, "examples": [{"arguments": {"data": {"from_parameter": "data"}, "intervals": [["2015-01-01", "2016-01-01"], ["2016-01-01", "2017-01-01"], ["2017-01-01", "2018-01-01"], ["2018-01-01", "2019-01-01"], ["2019-01-01", "2020-01-01"]], "labels": ["2015", "2016", "2017", "2018", "2019"], "reducer": {"process_graph": {"mean1": {"process_id": "mean", "result": true, "arguments": {"data": {"from_parameter": "data"}}}}}}}], "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#aggregate", "title": "Aggregation explained in the openEO documentation"}]}, {"id": "apply_dimension", "summary": "Apply a process to pixels along a dimension", "description": "Applies a process to all pixel values along a dimension of a raster data cube. For example, if the temporal dimension is specified the process will work on a time series of pixel values.\n\nThe process ``reduce_dimension()`` also applies a process to pixel values along a dimension, but drops the dimension afterwards. The process ``apply()`` applies a process to each pixel value in the data cube.\n\nThe target dimension is the source dimension if not specified otherwise in the `target_dimension` parameter. The pixel values in the target dimension get replaced by the computed pixel values. The name, type and reference system are preserved.\n\nThe dimension labels are preserved when the target dimension is the source dimension and the number of pixel values in the source dimension is equal to the number of values computed by the process. Otherwise, the dimension labels will be incrementing integers starting from zero, which can be changed using ``rename_labels()`` afterwards. The number of labels will equal to the number of values computed by the process.", "categories": ["cubes"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "process", "description": "Process to be applied on all pixel values. The specified process needs to accept an array and must return an array with at least one element. A process may consist of multiple sub-processes.", "schema": {"type": "object", "subtype": "process-graph", "minItems": 0.0, "deprecated": false, "parameters": [{"name": "data", "description": "A labeled array with elements of any type.", "schema": {"type": "array", "subtype": "labeled-array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}, "deprecated": false}}, {"name": "context", "description": "Additional data passed by the user.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"minItems": 0.0, "deprecated": false, "description": "The value to be set in the new data cube.", "schema": {"type": "array"}}}}, {"name": "dimension", "description": "The name of the source dimension to apply the process on. Fails with a `DimensionNotAvailable` exception if the specified dimension does not exist.", "schema": {"type": "string", "minItems": 0.0, "deprecated": false}}, {"name": "target_dimension", "description": "The name of the target dimension or `null` (the default) to use the source dimension specified in the parameter `dimension`.\n\nBy specifying a target dimension, the source dimension is removed. The target dimension with the specified name and the type `other` (see ``add_dimension()``) is created, if it doesn't exist yet.", "optional": true, "schema": {"type": ["string", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "context", "description": "Additional data to be passed to the process.", "optional": true, "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"description": "A data cube with the newly computed values.\n\nAll dimensions stay the same, except for the dimensions specified in corresponding parameters. There are three cases how the dimensions can change:\n\n1. The source dimension is the target dimension:\n   - The (number of) dimensions remain unchanged as the source dimension is the target dimension.\n   - The source dimension properties name and type remain unchanged.\n   - The dimension labels, the reference system and the resolution are preserved only if the number of pixel values in the source dimension is equal to the number of values computed by the process. Otherwise, all other dimension properties change as defined in the list below.\n2. The source dimension is not the target dimension and the latter exists:\n   - The number of dimensions decreases by one as the source dimension is dropped.\n   - The target dimension properties name and type remain unchanged. All other dimension properties change as defined in the list below.\n3. The source dimension is not the target dimension and the latter does not exist:\n   - The number of dimensions remain unchanged, but the source dimension is replaced with the target dimension.\n   - The target dimension has the specified name and the type other. All other dimension properties are set as defined in the list below.\n\nUnless otherwise stated above, for the given (target) dimension the following applies:\n\n- the number of dimension labels is equal to the number of values computed by the process,\n- the dimension labels are incrementing integers starting from zero,\n- the resolution changes, and\n- the reference system is undefined.", "schema": {"type": "object"}}, "exceptions": {"DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#apply", "title": "Apply explained in the openEO documentation"}]}, {"id": "apply_kernel", "summary": "Apply a spatial convolution with a kernel", "description": "Applies a 2D convolution (i.e. a focal operation with a weighted kernel) on the horizontal spatial dimensions (axes `x` and `y`) of the data cube.\n\nEach value in the kernel is multiplied with the corresponding pixel value and all products are summed up afterwards. The sum is then multiplied with the factor.\n\nThe process can't handle non-numerical or infinite numerical values in the data cube. Boolean values are converted to integers (`false` = 0, `true` = 1), but all other non-numerical or infinite values are replaced with zeroes by default (see parameter `replace_invalid`).\n\nFor cases requiring more generic focal operations or non-numerical values, see ``apply_neighborhood()``.", "categories": ["cubes", "math > image filter"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "kernel", "description": "Kernel as a two-dimensional array of weights. The inner level of the nested array aligns with the `x` axis and the outer level aligns with the `y` axis. Each level of the kernel must have an uneven number of elements, otherwise the process throws a `KernelDimensionsUneven` exception.", "schema": {"type": "array", "subtype": "kernel", "minItems": 0.0, "items": {"type": ": "Computes the arc sine of `x`. The arc sine is the inverse function of the sine so that *`arcsin(sin(x)) = x`*.\n\nWorks on radians only.\nThe no-data value `null` is passed through and therefore gets propagated.", "categories": ["math > trigonometric"], "parameters": [{"name": "x", "description": "A number.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed angle in radians.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 0}, "returns": 0}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/InverseSine.html", "title": "Inverse sine explained by Wolfram MathWorld"}]}, {"id": "arctan", "summary": "Inverse tangent", "description": "Computes the arc tangent of `x`. The arc tangent is the inverse function of the tangent so that *`arctan(tan(x)) = x`*.\n\nWorks on radians only.\nThe no-data value `null` is passed through and therefore gets propagated.", "categories": ["math > trigonometric"], "parameters": [{"name": "x", "description": "A number.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed angle in radians.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 0}, "returns": 0}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/InverseTangent.html", "title": "Inverse tangent explained by Wolfram MathWorld"}]}, {"id": "arctan2", "summary": "Inverse tangent of two numbers", "description": "Computes the arc tangent of two numbers `x` and `y`. It is similar to calculating the arc tangent of *`y / x`*, except that the signs of both arguments are used to determine the quadrant of the result.\n\nWorks on radians only.\nThe no-data value `null` is passed through and therefore gets propagated if any of the arguments is `null`.", "categories": ["math > trigonometric"], "parameters": [{"name": "y", "description": "A number to be used as the dividend." : "number", "minItems": 0.0, "deprecated": false}}, {"name": "max", "description": "Maximum value. If the value is greater than this value, the process will return the value of this parameter.", "schema": {"type": "number", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The value clipped to the specified range.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": -5, "min": -1, "max": 1}, "returns": -1}, {"arguments": {"x": 10.001, "min": 1, "max": 10}, "returns": 10}, {"arguments": {"x": 1e-06, "min": 0, "max": 0.02}, "returns": 1e-06}, {"arguments": {"x": null, "min": 0, "max": 1}}], "process_graph": {"min": {"process_id": "min", "result": false, "arguments": {"data": [{"from_parameter": "max"}, {"from_parameter": "x"}]}}, "max": {"process_id": "max", "result": true, "arguments": {"data": [{"from_parameter": "min"}, {"from_node": "min"}]}}}}, {"id": "constant", "summary": "Define a constant value", "description": "Defines a constant value that can be reused in multiple places of a process.", "categories": ["math > constants"], "parameters": [{"name": "x", "description": "The value of the constant.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type."}}], "returns": {"description": "The value of the constant.", "schema": {}}}, {"id": "cos", "summary": "Cosine", "description": "Computes the cosine of `x`.\n\nWorks on radians only.\nThe no-data value `null` is passed through and therefore gets propagated.", "categories": ["math > trigonometric"], "parameters": [{"name": "x", "description": "An angle in radians.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed cosine of `x`.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 0}, "returns": 1}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Cosine.html", "title": "Cosine explained by Wolfram MathWorld"}]}, {"id": "cosh", "summary": "Hyperbolic cosine", "description": "Computes the hyperbolic cosine of `x`.\n\nWorks on radians only.\nThe no-data value `null` is passed through and therefore gets propagated.", "categories": ["math > trigonometric"], "parameters": [{"name": "x", "description": "An angle in radians.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed hyperbolic cosine of `x`.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 0}, "returns": 1}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/HyperbolicCosine.html", "title": "Hyperbolic cosine explained by Wolfram MathWorld"}]}, {"id": "create_raster_cube", "summary": "Create an empty raster data cube", "description": "Creates a new raster data cube without dimensions. Dimensions can be added with ``add_dimension()``.", "categories": ["cubes"], "parameters": [], "returns": {"description": "An empty raster data cube with zero dimensions.", "schema": {"type": "object"}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html", "title": "Data Cubes explained in the openEO documentation"}]}, {"id": "dimension_labels", "summary": "Get the dimension labels", "description": "Gives all labels for a dimension in the data cube. The labels have the same order as in the data cube.\n\nIf a dimension with the specified name does not exist, the process fails with a `DimensionNotAvailable` exception.", "categories": ["cubes"], "parameters": [{"name": "data", "description": "The data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "dimension", "description": "The name of the dimension to get the labels for.", "schema": {"type": "string", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The labels as an array.", "schema": {"type": "array"}}, "exceptions": {"DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}}}, {"id": "divide", "summary": "Division of two numbers", "description": "Divides argument `x` by the argument `y` (*`x / y`*) and returns the computed result.\n\nNo-data values are taken into account so that `null` is returned if any element is such a value.\n\nThe computations follow [IEEE Standard 754](https://ieeexplore.ieee.org/document/8766229) whenever the processing environment supports it. Therefore, a division by zero results in \u00b1infinity if the processing environment supports it. Otherwise, a `DivisionByZero` exception must the thrown.", "categories": ["math"], "parameters": [{"name": "x", "description": "The dividend.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "y", "description": "The divisor.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed result.", "schema": {"type": ["number", "null"]}}, "exceptions": {"DivisionByZero": {"message": "Division by zero is not supported.", "http": 400}}, "examples": [{"arguments": {"x": 5, "y": 2.5}, "returns": 2}, {"arguments": {"x": -2, "y": 4}, "returns": -0.5}, {"arguments": {"x": 1, "y": null}}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Division.html", "title": "Division explained by Wolfram MathWorld"}, {"rel": "about", "href": "https://ieeexplore.ieee.org/document/8766229", "title": "IEEE Standard 754-2019 for Floating-Point Arithmetic"}]}, {"id": "drop_dimension", "summary": "Remove a dimension", "description": "Drops a dimension from the data cube.\n\nDropping a dimension only works on dimensions with a single dimension label left, otherwise the process fails with a `DimensionLabelCountMismatch` exception. Dimension values can be reduced to a single value with a filter such as ``filter_bands()`` or the ``reduce_dimension()`` process. If a dimension with the specified name does not exist, the process fails with a `DimensionNotAvailable` exception.", "categories": ["cubes"], "parameters": [{"name": "data", "description": "The data cube to drop a dimension from.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "name", "description": "Name of the dimension to drop.", "schema": {"type": "string", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "A data cube without the specified dimension. The number of dimensions decreases by one, but the dimension properties (name, type, labels, reference system and resolution) for all other dimensions remain unchanged.", "schema": {"type": "object"}}, "exceptions": {"DimensionLabelCountMismatch": {"message": "The number of dimension labels exceeds one, which requires a reducer.", "http": 400}, "DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}}}, {"id": "e", "summary": "Euler's number (e)", "description": "The real number *e* is a mathematical constant that is the base of the natural logarithm such that *`ln(e) = 1`*. The numerical value is approximately *2.71828*.", "categories": ["math > constants", "math > exponential & logarithmic"], "parameters": [], "returns": {"description": "The numerical value of Euler's number.", "schema": {"type": "number"}}, "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/e.html", "title": "Mathematical constant e explained by Wolfram MathWorld"}]}, {"id": "eq", "summary": "Equal to comparison", "description": "Compares whether `x` is strictly equal to `y`.\n\n**Remarks:**\n\n* Data types MUST be checked strictly. For example, a string with the content *1* is not equal to the number *1*. Nevertheless, an integer *1* is equal to a floating-point number *1.0* as `integer` is a sub-type of `number`.\n* If any operand is `null`, the return value is `null`. Therefore, `eq(null, null)` returns `null` instead of `true`.\n* If any operand is an array or object, the return value is `false`.\n* Strings are expected to be encoded in UTF-8 by default.\n* Temporal strings MUST be compared differently than other strings and MUST NOT be compared based on their string representation due to different possible representations. For example, the time zone representation `Z` (for UTC) has the same meaning as `+00:00`.", "categories": ["texts", "comparison"], "parameters": [{"name": "x", "description": "First operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "y", "description": "Second operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "delta", "description": "Only applicable for comparing two numbers. If this optional parameter is set to a positive non-zero number the equality of two numbers is checked against a delta value. This is especially useful to circumvent problems with floating-point inaccuracy in machine-based computation.\n\nThis option is basically an alias for the following computation: `lte(abs(minus([x, y]), delta)`", "optional": true, "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "case_sensitive", "description": "Only applicable for comparing two strings. Case sensitive comparison can be disabled by setting this parameter to `false`.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "`true` if `x` is equal to `y`, `null` if any operand is `null`, otherwise `false`.", "schema": {"type": ["boolean", "null"]}}, "examples": [{"arguments": {"x": 1, "y": null}}, {"arguments": {"x": null, "y": null}}, {"arguments": {"x": 1, "y": 1}, "returns": true}, {"arguments": {"x": 1, "y": "1"}, "returns": false}, {"arguments": {"x": 0, "y": false}, "returns": false}, {"arguments": {"x": 1.02, "y": 1, "delta": 0.01}, "returns": false}, {"arguments": {"x": -1, "y": -1.001, "delta": 0.01}, "returns": true}, {"arguments": {"x": 115, "y": 110, "delta": 10}, "returns": true}, {"arguments": {"x": "Test", "y": "test"}, "returns": false}, {"arguments": {"x": "Test", "y": "test", "case_sensitive": false}, "returns": true}, {"arguments": {"x": "\u00c4", "y": "\u00e4", "case_sensitive": false}, "returns": true}, {"arguments": {"x": "00:00:00+00:00", "y": "00:00:00Z"}, "returns": true}, {"description": "`y` is not a valid date-time representation and therefore will be treated as a string so that the provided values are not equal.", "arguments": {"x": "2018-01-01T12:00:00Z", "y": "2018-01-01T12:00:00"}, "returns": false}, {"description": "01:00 in the time zone +1 is equal to 00:00 in UTC.", "arguments": {"x": "2018-01-01T00:00:00Z", "y": "2018-01-01T01:00:00+01:00"}, "returns": true}, {"arguments": {"x": [1, 2, 3], "y": [1, 2, 3]}, "returns": false}]}, {"id": "exp", "summary": "Exponentiation to the base e", "description": "Exponential function to the base *e* raised to the power of `p`.\n\nThe no-data value `null` is passed through and therefore gets propagated.", "categories": ["math > exponential & logarithmic"], "parameters": [{"name": "p", "description": "The numerical exponent.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed value for *e* raised to the power of `p`.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"p": 0}, "returns": 1}, {"arguments": {"p": null}}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/ExponentialFunction.html", "title": "Exponential function explained by Wolfram MathWorld"}], "process_graph": {"e": {"process_id": "e", "result": false, "arguments": {}}, "power": {"process_id": "power", "result": true, "arguments": {"base": {"from_node": "e"}, "p": {"from_parameter": "p"}}}}}, {"id": "extrema", "summary": "Minimum and maximum values", "description": "Two element array containing the minimum and the maximum values of `data`.\n\nThis process is basically an alias for calling both ``min()`` and ``max()``, but may be implemented more performant by back-ends as it only needs to iterate over the data once instead of twice.", "categories": ["math > statistics"], "parameters": [{"name": "data", "description": "An array of numbers.", "schema": {"type": "array", "minItems": 0.0, "items": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}, "deprecated": false}}, {"name": "ignore_nodata", "description": "Indicates whether no-data values are ignored or not. Ignores them by default. Setting this flag to `false` considers no-data values so that an array with two `null` values is returned if any value is such a value.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "An array containing the minimum and maximum values for the specified numbers. The first element is the minimum, the second element is the maximum. If the input array is empty both elements are set to `null`.", "schema": [{"type": "array"}, {"type": "array"}]}, "examples": [{"arguments": {"data": [1, 0, 3, 2]}, "returns": [0, 3]}, {"arguments": {"data": [5, 2.5, null, -0.7]}, "returns": [-0.7, 5]}, {"arguments": {"data": [1, 0, 3, null, 2], "ignore_nodata": false}, "returns": [null, null]}, {"description": "The input array is empty: return two `null` values.", "arguments": {"data": []}, "returns": [null, null]}]}, {"id": "filter_bands", "summary": "Filter the bands by names", "description": "Filters the bands in the data cube so that bands that don't match any of the criteria are dropped from the data cube. The data cube is expected to have only one dimension of type `bands`. Fails with a `DimensionMissing` exception if no such dimension exists.\n\nThe following criteria can be used to select bands:\n\n* `bands`: band name or common band name (e.g. `B01`, `B8A`, `red` or `nir`)\n* `wavelengths`: ranges of wavelengths in micrometers (\u03bcm) (e.g. 0.5 - 0.6)\n\nAll these information are exposed in the band metadata of the collection. To keep algorithms interoperable it is recommended to prefer the common band names or the wavelengths over band names that are specific to the collection and/or back-end.\n\nIf multiple criteria are specified, any of them must match and not all of them, i.e. they are combined with an OR-operation. If no criteria are specified, the `BandFilterParameterMissing` exception must be thrown.\n\n**Important:** The order of the specified array defines the order of the bands in the data cube, which can be important for subsequent processes. If multiple bands are matched by a single criterion (e.g. a range of wavelengths), they stay in the original order.", "categories": ["cubes", "filter"], "parameters": [{"name": "data", "description": "A data cube with bands.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "bands", "description": "A list of band names. Either the unique band name (metadata field `name` in bands) or one of the common band names (metadata field `common_name` in bands). If the unique band name and the common name conflict, the unique band name has a higher priority.\n\nThe order of the specified array defines the order of the bands in the data cube. If multiple bands match a common name, all matched bands are included in the original order.", "optional": true, "default": [], "schema": {"type": "array", "minItems": 0.0, "items": {"type": "string", "subtype": "band-name", "minItems": 0.0, "deprecated": false}, "deprecated": false}}, {"name": "wavelengths", "description": "A list of sub-lists with each sub-list consisting of two elements. The first element is the minimum wavelength and the second element is the maximum wavelength. Wavelengths are specified in micrometers (\u03bcm).\n\nThe order of the specified array defines the order of the bands in the data cube. If multiple bands match the wavelengths, all matched bands are included in the original order.", "optional": true, "default": [], "schema": {"type": "array", "minItems": 0.0, "items": {"type": "array", "minItems": 2.0, "maxItems": 2.0, "items": {"type": "number", "minItems": 0.0, "deprecated": false}, "deprecated": false, "examples": [[[0.45, 0.5], [0.6, 0.7]]]}, "deprecated": false}}], "returns": {"description": "A data cube limited to a subset of its original bands. The dimensions and dimension properties (name, type, labels, reference system and resolution) remain unchanged, except that the dimension of type `bands` has less (or the same) dimension labels.", "schema": {"type": "object"}}, "exceptions": {"BandFilterParameterMissing": {"message": "The process `filter_bands` requires any of the parameters `bands`, `common_names` or `wavelengths` to be set.", "http": 400}, "DimensionMissing": {"message": "A band dimension is missing.", "http": 400}}, "links": [{"rel": "about", "href": "https://github.com/radiantearth/stac-spec/tree/master/extensions/eo#common-band-names", "title": "List of common band names as specified by the STAC specification"}, {"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#filter", "title": "Filters explained in the openEO documentation"}]}, {"id": "filter_bbox", "summary": "Spatial filter using a bounding box", "description": "Limits the data cube to the specified bounding box.\n\nThe filter retains a pixel in the data cube if the point at the pixel center intersects with the bounding box (as defined in the Simple Features standard by the OGC).", "categories": ["cubes", "filter"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "extent", "description": "A bounding box, which may include a vertical axis (see `base` and `height`).", "schema": {"type": "object", "subtype": "bounding-box", "minItems": 0.0, "deprecated": false, "required": ["west", "south", "east", "north"], "properties": {"west": {"description": "West (lower left corner, coordinate axis 1).", "type": "number"}, "south": {"description": "South (lower left corner, coordinate axis 2).", "type": "number"}, "east": {"description": "East (upper right corner, coordinate axis 1).", "type": "number"}, "north": {"description": "North (upper right corner, coordinate axis 2).", "type": "number"}, "base": {"description": "Base (optional, lower left corner, coordinate axis 3).", "type": ["number", "null"], "default": null}, "height": {"description": "Height (optional, upper right corner, coordinate axis 3).", "type": ["number", "null"], "default": null}, "crs": {"description": "Coordinate reference system of the extent, specified as as [EPSG code](http://www.epsg-registry.org/), [WKT2 (ISO 19162) string](http://docs.opengeospatial.org/is/18-010r7/18-010r7.html) or [PROJ definition (deprecated)](https://proj.org/usage/quickstart.html). Defaults to `4326` (EPSG code 4326) unless the client explicitly requests a different coordinate reference system.", "anyOf": [{"title": "EPSG Code", "type": "integer", "subtype": "epsg-code", "minimum": 1000, "examples": [3857]}, {"title": "WKT2", "type": "string", "subtype": "wkt2-definition"}, {"title": "PROJ definition", "type": "string", "subtype": "proj-definition", "deprecated": true}], "default": 4326}}}}], "returns": {"description": "A data cube restricted to the bounding box. The dimensions and dimension properties (name, type, labels, reference system and resolution) remain unchanged, except that the spatial dimensions have less (or the same) dimension labels.", "schema": {"type": "object"}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#filter", "title": "Filters explained in the openEO documentation"}, {"rel": "about", "href": "https://proj.org/usage/projections.html", "title": "PROJ parameters for cartographic projections"}, {"rel": "about", "href": "http://www.epsg-registry.org/", "title": "Official EPSG code registry"}, {"rel": "about", "href": "http://www.epsg.io/", "title": "Unofficial EPSG code database"}, {"rel": "about", "href": "http://www.opengeospatial.org/standards/sfa", "title": "Simple Features standard by the OGC"}]}, {"id": "filter_spatial", "summary": "Spatial filter using geometries", "description": "Limits the data cube over the spatial dimensions to the specified geometries.\n\n- For **polygons**, the filter retains a pixel in the data cube if the point at the pixel center intersects with at least one of the polygons (as defined in the Simple Features standard by the OGC).\n- For **points**, the process considers the closest pixel center.\n- For **lines** (line strings), the process considers all the pixels whose centers are closest to at least one point on the line.\n\nMore specifically, pixels outside of the bounding box of the given geometry will not be available after filtering. All pixels inside the bounding box that are not retained will be set to `null` (no data).", "categories": ["cubes", "filter"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "geometries", "description": "One or more geometries used for filtering, specified as GeoJSON.", "schema": {"type": "object", "subtype": "geojson", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "A data cube restricted to the specified geometries. The dimensions and dimension properties (name, type, labels, reference system and resolution) remain unchanged, except that the spatial dimensions have less (or the same) dimension labels.", "schema": {"type": "object"}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#filter", "title": "Filters explained in the openEO documentation"}, {"rel": "about", "href": "http://www.opengeospatial.org/standards/sfa", "title": "Simple Features standard by the OGC"}]}, {"id": "filter_temporal", "summary": "Temporal filter based on temporal intervals", "description": "Limits the data cube to the specified interval of dates and/or times.\n\nMore precisely, the filter checks whether each of the temporal dimension labels is greater than or equal to the lower boundary (start date/time) and less than the value of the upper boundary (end date/time). This corresponds to a left-closed interval, which contains the lower boundary but not the upper boundary.", "categories": ["cubes", "filter"], "parameters": [{"name": "data", "description": "A data cube.", "schema": {"type": "object", "subtype": "raster-cube", "minItems": 0.0, "deprecated": false}}, {"name": "extent", "description": "Left-closed temporal interval, i.e. an array with exactly two elements:\n\n1. The first element is the start of the temporal interval. The specified instance in time is **included** in the interval.\n2. The second element is the end of the temporal interval. The specified instance in time is **excluded** from the interval.\n\nThe specified temporal strings follow [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339.html). Also supports open intervals by setting one of the boundaries to `null`, but never both.", "schema": {"type": "array", "subtype": "temporal-interval", "minItems": 2.0, "maxItems": 2.0, "items": {"minItems": 0.0, "deprecated": false, "anyOf": [{"type": "string", "format": "date-time", "subtype": "date-time"}, {"type": "string", "format": "date", "subtype": "date"}, {"type": "string", "subtype": "year", "minLength": 4, "maxLength": 4, "pattern": "^\\d{4}$"}, {"type": "null"}]}, "deprecated": false, "examples": [["2015-01-01T00:00:00Z", "2016-01-01T00:00:00Z"], ["2015-01-01", "2016-01-01"]]}}, {"name": "dimension", "description": "The name of the temporal dimension to filter on. If no specific dimension is specified or it is set to `null`, the filter applies to all temporal dimensions. Fails with a `DimensionNotAvailable` exception if the specified dimension does not exist.", "optional": true, "schema": {"type": ["string", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "A data cube restricted to the specified temporal extent. The dimensions and dimension properties (name, type, labels, reference system and resolution) remain unchanged, except that the temporal dimensions (determined by `dimensions` parameter) may have less dimension labels.", "schema": {"type": "object"}}, "exceptions": {"DimensionNotAvailable": {"message": "A dimension with the specified name does not exist.", "http": 400}}, "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html#filter", "title": "Filters explained in the openEO documentation"}]}, {"id": "first", "summary": "First element", "description": "Gives the first element of an array.\n\nAn array without non-`null` elements resolves always with `null`.", "categories": ["arrays", "reducer"], "parameters": [{"name": "data", "description": "An array with elements of any data type.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}, {"name": "ignore_nodata", "description": "Indicates whether no-data values are ignored or not. Ignores them by default. Setting this flag to `false` considers no-data values so that `null` is returned if the first value is such a value.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The first element of the input array.", "schema": {}}, "examples": [{"arguments": {"data": [1, 0, 3, 2]}, "returns": 1}, {"arguments": {"data": [null, "A", "B"]}, "returns": "A"}, {"arguments": {"data": [null, 2, 3], "ignore_nodata": false}}, {"description": "The input array is empty: return `null`.", "arguments": {"data": []}}]}, {"id": "floor", "summary": "Round fractions down", "description": "The greatest integer less than or equal to the number `x`.\n\nThis process is *not* an alias for the ``int()`` process as defined by some mathematicians, see the examples for negative numbers in both processes for differences.\n\nThe no-data value `null` is passed through and therefore gets propagated.", "categories": ["math > rounding"], "parameters": [{"name": "x", "description": "A number to round down.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The number rounded down.", "schema": {"type": ["integer", "null"]}}, "examples": [{"arguments": {"x": 0}, "returns": 0}, {"arguments": {"x": 3.5}, "returns": 3}, {"arguments": {"x": -0.4}, "returns": -1}, {"arguments": {"x": -3.5}, "returns": -4}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/FloorFunction.html", "title": "Floor explained by Wolfram MathWorld"}]}, {"id": "gt", "summary": "Greater than comparison", "description": "Compares whether `x` is strictly greater than `y`.\n\n**Remarks:**\n\n* If any operand is `null`, the return value is `null`.\n* If any operand is an array or object, the return value is `false`.\n* If any operand is not a `number` or temporal string (`date`, `time` or `date-time`), the process returns `false`.\n* Temporal strings can *not* be compared based on their string representation due to the time zone / time-offset representations.", "categories": ["comparison"], "parameters": [{"name": "x", "description": "First operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "y", "description": "Second operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}], "returns": {"description": "`true` if `x` is strictly greater than `y` or `null` if any operand is `null`, otherwise `false`.", "schema": {"type": ["boolean", "null"]}}, "examples": [{"arguments": {"x": 1, "y": null}}, {"arguments": {"x": 0, "y": 0}, "returns": false}, {"arguments": {"x": 2, "y": 1}, "returns": true}, {"arguments": {"x": -0.5, "y": -0.6}, "returns": true}, {"arguments": {"x": "00:00:00Z", "y": "00:00:00+01:00"}, "returns": true}, {"arguments": {"x": "1950-01-01T00:00:00Z", "y": "2018-01-01T12:00:00Z"}, "returns": false}, {"arguments": {"x": "2018-01-01T12:00:00+00:00", "y": "2018-01-01T12:00:00Z"}, "returns": false}, {"arguments": {"x": true, "y": 0}, "returns": false}, {"arguments": {"x": true, "y": false}, "returns": false}]}, {"id": "gte", "summary": "Greater than or equal to comparison", "description": "Compares whether `x` is greater than or equal to `y`.\n\n**Remarks:**\n\n* If any operand is `null`, the return value is `null`. Therefore, `gte(null, null)` returns `null` instead of `true`.\n* If any operand is an array or object, the return value is `false`.\n* If the operands are not equal (see process ``eq()``) and any of them is not a `number` or temporal string (`date`, `time` or `date-time`), the process returns `false`.\n* Temporal strings can *not* be compared based on their string representation due to the time zone / time-offset representations.", "categories": ["comparison"], "parameters": [{"name": "x", "description": "First operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "y", "description": "Second operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}], "returns": {"description": "`true` if `x` is greater than or equal to `y`, `null` if any operand is `null`, otherwise `false`.", "schema": {"type": ["boolean", "null"]}}, "examples": [{"arguments": {"x": 1, "y": null}}, {"arguments": {"x": 0, "y": 0}, "returns": true}, {"arguments": {"x": 1, "y": 2}, "returns": false}, {"arguments": {"x": -0.5, "y": -0.6}, "returns": true}, {"arguments": {"x": "00:00:00Z", "y": "00:00:00+01:00"}, "returns": true}, {"arguments": {"x": "1950-01-01T00:00:00Z", "y": "2018-01-01T12:00:00Z"}, "returns": false}, {"arguments": {"x": "2018-01-01T12:00:00+00:00", "y": "2018-01-01T12:00:00Z"}, "returns": true}, {"arguments": {"x": true, "y": false}, "returns": false}, {"arguments": {"x": [1, 2, 3], "y": [1, 2, 3]}, "returns": false}], "process_graph": {"eq": {"process_id": "eq", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "y"}}}, "gt": {"process_id": "gt", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "y"}}}, "or": {"process_id": "or", "result": true, "arguments": {"x": {"from_node": "gt"}, "y": {"from_node": "eq"}}}}}, {"id": "is_valid", "summary": "Value is valid data", "description": "Checks whether the specified value `x` is valid. The following values are considered valid:\n\n* Any finite numerical value (integers and floating-point numbers). The definition of finite numbers follows the [IEEE Standard 754](https://ieeexplore.ieee.org/document/4610935) and excludes the special value `NaN` (not a number).\n* Any other value that is not a no-data value according to ``is_nodata()`. Thus all arrays, objects and strings are valid, regardless of their content.", "categories": ["comparison"], "parameters": [{"name": "x", "description": "The data to check.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}], "returns": {"description": "`true` if the data is valid, otherwise `false`.", "schema": {"type": "boolean"}}, "examples": [{"arguments": {"x": 1}, "returns": true}, {"arguments": {"x": "Test"}, "returns": true}, {"arguments": {"x": null}, "returns": false}, {"arguments": {"x": [null, null]}, "returns": true}], "links": [{"rel": "about", "href": "https://ieeexplore.ieee.org/document/4610935", "title": "IEEE Standard 754-2008 for Floating-Point Arithmetic"}]}, {"id": "last", "summary": "Last element", "description": "Gives the last element of an array.\n\nAn array without non-`null` elements resolves always with `null`.", "categories": ["arrays", "reducer"], "parameters": [{"name": "data", "description": "An array with elements of any data type.", "schema": {"type": "array", "minItems": 0.0, "items": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}, "deprecated": false}}, {"name": "ignore_nodata", "description": "Indicates whether no-data values are ignored or not. Ignores them by default. Setting this flag to `false` considers no-data values so that `null` is returned if the last value is such a value.", "optional": true, "default": true, "schema": {"type": "boolean", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The last element of the input array.", "schema": {}}, "examples": [{"arguments": {"data": [1, 0, 3, 2]}, "returns": 2}, {"arguments": {"data": ["A", "B", null]}, "returns": "B"}, {"arguments": {"data": [0, 1, null], "ignore_nodata": false}}, {"description": "The input array is empty: return `null`.", "arguments": {"data": []}}]}, {"id": "linear_scale_range", "summary": "Linear transformation between two ranges", "description": "Performs a linear transformation between the input and output range.\n\nThe given number in `x` is clipped to the bounds specified in `inputMin` and `inputMax` so that the underlying formula *`((x - inputMin) / (inputMax - inputMin)) * (outputMax - outputMin) + outputMin`* never returns any value lower than `outputMin` or greater than `outputMax`.\n\nPotential use case include\n\n* scaling values to the 8-bit range (0 - 255) often used for numeric representation of values in one of the channels of the [RGB colour model](https://en.wikipedia.org/wiki/RGB_color_model#Numeric_representations) or\n* calculating percentages (0 - 100).\n\nThe no-data value `null` is passed through and therefore gets propagated.", "categories": ["math"], "parameters": [{"name": "x", "description": "A number to transform. The number gets clipped to the bounds specified in `inputMin` and `inputMax`.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "inputMin", "description": "Minimum value the input can obtain.", "schema": {"type": "number", "minItems": 0.0, "deprecated": false}}, {"name": "inputMax", "description": "Maximum value the input can obtain.", "schema": {"type": "number", "minItems": 0.0, "deprecated": false}}, {"name": "outputMin", "description": "Minimum value of the desired output range.", "optional": true, "default": 0, "schema": {"type": "number", "minItems": 0.0, "deprecated": false}}, {"name": "outputMax", "description": "Maximum value of the desired output range.", "optional": true, "default": 1, "schema": {"type": "number", "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The transformed number.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 0.3, "inputMin": -1, "inputMax": 1, "outputMin": 0, "outputMax": 255}, "returns": 165.75}, {"arguments": {"x": 25.5, "inputMin": 0, "inputMax": 255}, "returns": 0.1}, {"arguments": {"x": null, "inputMin": 0, "inputMax": 100}}, {"description": "Shows that the input data is clipped.", "arguments": {"x": 1.12, "inputMin": 0, "inputMax": 1, "outputMin": 0, "outputMax": 255}, "returns": 255}], "process_graph": {"subtract1": {"process_id": "subtract", "result": false, "arguments": {"x": {"from_parameter": "x"}, "y": {"from_parameter": "inputMin"}}}, "subtract2": {"process_id": "subtract", "result": false, "arguments": {"x": {"from_parameter": "inputMax"}, "y": {"from_parameter": "inputMin"}}}, "subtract3": {"process_id": "subtract", "result": false, "arguments": {"x": {"from_parameter": "outputMax"}, "y": {"from_parameter": "outputMin"}}}, "divide": {"process_id": "divide", "result": false, "arguments": {"x": {"from_node": "subtract1"}, "y": {"from_node": "subtract2"}}}, "multiply": {"process_id": "multiply", "result": false, "arguments": {"x": {"from_node": "divide"}, "y": {"from_node": "subtract3"}}}, "add": {"process_id": "add", "result": true, "arguments": {"x": {"from_node": "multiply"}, "y": {"from_parameter": "outputMin"}}}}}, {"id": "ln", "summary": "Natural logarithm", "description": "The natural logarithm is the logarithm to the base *e* of the number `x`, which equals to using the *log* process with the base set to *e*. The natural logarithm is the inverse function of taking *e* to the power x.\n\nThe no-data value `null` is passed through.\n\nThe computations follow [IEEE Standard 754](https://ieeexplore.ieee.org/document/8766229) whenever the processing environment supports it. Therefore, *`ln(0)`* results in \u00b1infinity if the processing environment supports it or otherwise an exception is thrown.", "categories": ["math > exponential & logarithmic"], "parameters": [{"name": "x", "description": "A number to compute the natural logarithm for.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed natural logarithm.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 1}, "returns": 0}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/NaturalLogarithm.html", "title": "Natural logarithm explained by Wolfram MathWorld"}, {"rel": "about", "href": "https://ieeexplore.ieee.org/document/8766229", "title": "IEEE Standard 754-2019 for Floating-Point Arithmetic"}], "process_graph": {"e": {"process_id": "e", "result": false, "arguments": {}}, "log": {"process_id": "log", "result": true, "arguments": {"x": {"from_parameter": "x"}, "base": {"from_node": "e"}}}}}, {"id": "load_collection", "summary": "Load a collection", "description": "Loads a collection from the current back-end by its id and returns it as a processable data cube. The data that is added to the data cube can be restricted with the parameters `spatial_extent`, `temporal_extent`, `bands` and `properties`.\n\n**Remarks:**\n\n* The bands (and all dimensions that specify nominal dimension labels) are expected to be ordered as specified in the metadata if the `bands` parameter is set to `null`.\n* If no additional parameter is specified this would imply that the whole data set is expected to be loaded. Due to the large size of many data sets, this is not recommended and may be optimized by back-ends to only load the data that is actually required after evaluating subsequent processes such as filters. This means that the pixel values should be processed only after the data has been limited to the required extent and as a consequence also to a manageable size.", "categories": ["cubes", "import"], "parameters": [{"name": "id", "description": "The collection id.", "schema": {"type": "string", "subtype": "collection-id", "pattern": "^[\\w\\-\\.~/]+$", "minItems": 0.0, "deprecated": false}}, {"name": "spatial_extent", "description": "Limits the data to load from the collection to the specified bounding box or polygons.\n\nThe process puts a pixel into the data cube if the point at the pixel center intersects with the bounding box or any of the polygons (as defined in the Simple Features standard by the OGC).\n\nThe GeoJSON can be one of the following feature types:\n\n* A `Polygon` or `MultiPolygon` geometry,\n* a `Feature` with a `Polygon` or `MultiPolygon` geometry,\n* a `FeatureCollection` containing at least one `Feature` with `Polygon` or `MultiPolygon` geometries, or\n* a `GeometryCollection` containing `Polygon` or `MultiPolygon` geometries. To maximize interoperability, `GeometryCollection` should be avoided in favour of one of the alternatives above.\n\nSet this parameter to `null` to set no limit for the spatial extent. Be careful with this when loading large datasets! It is recommended to use this parameter instead of using ``filter_bbox()`` or ``filter_spatial()`` directly after loading unbounded data.", "schema": [{"type": "object", "subtype": "bounding-box", "minItems": 0.0, "deprecated": false, "title": "Bounding Box", "required": ["west", "south", "east", "north"], "properties": {"west": {"description": "West (lower left corner, coordinate axis 1).", "type": "number"}, "south": {"description": "South (lower left corner, coordinate axis 2).", "type": "number"}, "east": {"description": "East (upper right corner, coordinate axis 1).", "type": "number"}, "north": {"description": "North (upper right corner, coordinate axis 2).", "type": "number"}, "base": {"description": "Base (optional, lower left corner, coordinate axis 3).", "type": ["number", "null"], "default": null}, "height": {"description": "Height (optional, upper right corner, coordinate axis 3).", "type": ["number", "null"], "default": null}, "crs": {"description": "Coordinate reference system of the extent, specified as as [EPSG code](http://www.epsg-registry.org/), [WKT2 (ISO 19162) string](http://docs.opengeospatial.org/is/18-010r7/18-010r7.html) or [PROJ definition (deprecated)](https://proj.org/usage/quickstart.html). Defaults to `4326` (EPSG code 4326) unless the client explicitly requests a different coordinate reference system.", "anyOf": [{"title": "EPSG Code", "type": "integer", "subtype": "epsg-code", "minimum": 1000, "examples": [3857]}, {"title": "WKT2", "type": "string", "subtype": "wkt2-definition"}, {"title": "PROJ definition", "type": "string", "subtype": "proj-definition", "deprecated": true}], "default": 4326}}}, {"type": "object", "subtype": "geojson", "minItems": 0.0, "deprecated": false, "title": "GeoJSON", "description": "Limits the data cube to the bounding box of the given geometry. All pixels inside the bounding box that do not intersect with any of the polygons will be set to no data (`null`)."}, {"type": "null", "minItems": 0.0, "deprecated": false, "title": "No filter", "description": "Don't filter spatially. All data is included in the data cube."}]}, {"name": "temporal_extent", "description": "Limits the data to load from the collection to the specified left-closed temporal interval. Applies to all temporal dimensions. The interval has to be specified as an array with exactly two elements:\n\n1. The first element is the start of the temporal interval. The specified instance in time is **included** in the interval.\n2. The second element is the end of the temporal interval. The specified instance in time is **excluded** from the interval.\n\nThe specified temporal strings follow [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339.html). Also supports open intervals by setting one of the boundaries to `null`, but never both.\n\nSet this parameter to `null` to set no limit for the temporal extent. Be careful with this when loading large datasets! It is recommended to use this parameter instead of using ``filter_temporal()`` directly after loading unbounded data.", "schema": [{"type": "array", "subtype": "temporal-interval", "minItems": 2.0, "maxItems": 2.0, "items": {"minItems": 0.0, "deprecated": false, "anyOf": [{"type": "string", "format": "date-time", "subtype": "date-time"}, {"type": "string", "format": "date", "subtype": "date"}, {"type": "string", "subtype": "year", "minLength": 4, "maxLength": 4, "pattern": "^\\d{4}$"}, {"type": "null"}]}, "deprecated": false, "examples": [["2015-01-01T00:00:00Z", "2016-01-01T00:00:00Z"], ["2015-01-01", "2016-01-01"]]}, {"type": "null", "minItems": 0.0, "deprecated": false, "title": "No filter", "description": "Don't filter temporally. All data is included in the data cube."}]}, {"name": "bands", "description": "Only adds the specified bands into the data cube so that bands that don't match the list of band names are not available. Applies to all dimensions of type `bands`.\n\nEither the unique band name (metadata field `name` in bands) or one of the common band names (metadata field `common_name` in bands) can be specified. If the unique band name and the common name conflict, the unique band name has a higher priority.\n\nThe order of the specified array defines the order of the bands in the data cube. If multiple bands match a common name, all matched bands are included in the original order.\n\nIt is recommended to use this parameter instead of using ``filter_bands()`` directly after loading unbounded data.", "optional": true, "schema": [{"type": "array", "minItems": 0.0, "items": {"type": "string", "subtype": "band-name", "minItems": 0.0, "deprecated": false}, "deprecated": false}, {"type": "null", "minItems": 0.0, "deprecated": false, "title": "No filter", "description": "Don't filter bands. All bands are included in the data cube."}]}, {"name": "properties", "description": "Limits the data by metadata properties to include only data in the data cube which all given conditions return `true` for (AND operation).\n\nSpecify key-value-pairs with the key being the name of the metadata property, which can be retrieved with the openEO Data Discovery for Collections. The value must be a condition (user-defined process) to be evaluated against the collection metadata, see the example.", "optional": true, "schema": [{"type": "object", "subtype": "metadata-filter", "minItems": 0.0, "deprecated": false, "title": "Filters", "description": "A list of filters to check against. Specify key-value-pairs with the key being the name of the metadata property name and the value being a process evaluated against the metadata values.", "additionalProperties": {"type": "object", "subtype": "process-graph", "parameters": [{"name": "value", "description": "The property value to be checked against.", "schema": {"description": "Any data type."}}], "returns": {"description": "`true` if the data should be loaded into the data cube, otherwise `false`.", "schema": {"type": "boolean"}}}}, {"type": "null", "minItems": 0.0, "deprecated": false, "title": "No filter", "description": "Don't filter by metadata properties."}]}], "returns": {"description": "A data cube for further processing. The dimensions and dimension properties (name, type, labels, reference system and resolution) correspond to the collection's metadata, but the dimension labels are restricted as specified in the parameters.", "schema": {"type": "object"}}, "examples": [{"description": "Loading `Sentinel-2B` data from a `Sentinel-2` collection for 2018, but only with cloud cover between 0 and 50%.", "arguments": {"id": "Sentinel-2", "spatial_extent": {"west": 16.1, "east": 16.6, "north": 48.6, "south": 47.2}, "temporal_extent": ["2018-01-01", "2019-01-01"], "properties": {"eo:cloud_cover": {"process_graph": {"cc": {"process_id": "between", "arguments": {"x": {"from_parameter": "value"}, "min": 0, "max": 50}, "result": true}}}, "platform": {"process_graph": {"pf": {"process_id": "eq", "arguments": {"x": {"from_parameter": "value"}, "y": "Sentinel-2B", "case_sensitive": false}, "result": true}}}}}}], "links": [{"rel": "about", "href": "https://openeo.org/documentation/1.0/datacubes.html", "title": "Data Cubes explained in the openEO documentation"}, {"rel": "about", "href": "https://proj.org/usage/projections.html", "title": "PROJ parameters for cartographic projections"}, {"rel": "about", "href": "http://www.epsg-registry.org/", "title": "Official EPSG code registry"}, {"rel": "about", "href": "http://www.epsg.io/", "title": "Unofficial EPSG code database"}, {"rel": "about", "href": "http://www.opengeospatial.org/standards/sfa", "title": "Simple Features standard by the OGC"}, {"rel": "about", "href": "https://github.com/radiantearth/stac-spec/tree/master/extensions/eo#common-band-names", "title": "List of common band names as specified by the STAC specification"}]}, {"id": "log", "summary": "Logarithm to a base", "description": "Logarithm to the base `base` of the number `x` is defined to be the inverse function of taking b to the power of x.\n\nThe no-data value `null` is passed through and therefore gets propagated if any of the arguments is `null`.\n\nThe computations follow [IEEE Standard 754](https://ieeexplore.ieee.org/document/8766229) whenever the processing environment supports it. Therefore, `log(0, 2)` results in \u00b1infinity if the processing environment supports it or otherwise an exception is thrown.", "categories": ["math > exponential & logarithmic"], "parameters": [{"name": "x", "description": "A number to compute the logarithm for.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}, {"name": "base", "description": "The numerical base.", "schema": {"type": ["number", "null"], "minItems": 0.0, "deprecated": false}}], "returns": {"description": "The computed logarithm.", "schema": {"type": ["number", "null"]}}, "examples": [{"arguments": {"x": 10, "base": 10}, "returns": 1}, {"arguments": {"x": 2, "base": 2}, "returns": 1}, {"arguments": {"x": 4, "base": 2}, "returns": 2}, {"arguments": {"x": 1, "base": 16}, "returns": 0}], "links": [{"rel": "about", "href": "http://mathworld.wolfram.com/Logarithm.html", "title": "Logarithm explained by Wolfram MathWorld"}, {"rel": "about", "href": "https://ieeexplore.ieee.org/document/8766229", "title": "IEEE Standard 754-2019 for Floating-Point Arithmetic"}]}, {"id": "lt", "summary": "Less than comparison", "description": "Compares whether `x` is strictly less than `y`.\n\n**Remarks:**\n\n* If any operand is `null`, the return value is `null`.\n* If any operand is an array or object, the return value is `false`.\n* If any operand is not a `number` or temporal string (`date`, `time` or `date-time`), the process returns `false`.\n* Temporal strings can *not* be compared based on their string representation due to the time zone / time-offset representations.", "categories": ["comparison"], "parameters": [{"name": "x", "description": "First operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}, {"name": "y", "description": "Second operand.", "schema": {"minItems": 0.0, "deprecated": false, "description": "Any data type is allowed."}}], "returns": {"description": "`true` if `x` is strictly less than `y`, `null` if any operand is `null`, otherwise `false`.", "schema": {"type": ["boolean", "null"]}}, "examples": [{"arguments": {"x": 1, "y": null}
